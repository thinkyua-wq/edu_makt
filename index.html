<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>MGG 교육마케팅활동</title>
<script>
  // === 다중 CDN 폴백 시스템 ===
  // CDN이 차단되거나 느릴 경우 자동으로 다음 CDN을 시도합니다.
  // 한국/중국 회사 네트워크 환경에서도 안정 동작하도록 4개 CDN 사용.
  (function() {
    var libs = [
      {
        name: 'tailwind',
        check: function() { return typeof tailwind !== 'undefined' || document.querySelector('[data-tailwind-loaded]') !== null; },
        urls: [
          'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4',
          'https://cdn.tailwindcss.com',
          'https://unpkg.com/@tailwindcss/browser@4',
          'https://fastly.jsdelivr.net/npm/@tailwindcss/browser@4',
        ],
        optional: true  // Tailwind는 선택사항 (실패해도 앱은 동작)
      },
      {
        name: 'react',
        check: function() { return typeof React !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
          'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
          'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
          'https://fastly.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
        ]
      },
      {
        name: 'react-dom',
        check: function() { return typeof ReactDOM !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
          'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
          'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
          'https://fastly.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
        ]
      },
      {
        name: 'prop-types',
        check: function() { return typeof PropTypes !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js',
          'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
          'https://unpkg.com/prop-types@15.8.1/prop-types.min.js',
          'https://fastly.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
        ]
      },
      {
        name: 'recharts',
        check: function() { return typeof Recharts !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/Recharts/2.12.7/Recharts.js',
          'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js',
          'https://unpkg.com/recharts@2.12.7/umd/Recharts.js',
          'https://fastly.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js',
        ]
      },
      {
        name: 'lz-string',
        check: function() { return typeof LZString !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js',
          'https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js',
          'https://unpkg.com/lz-string@1.5.0/libs/lz-string.min.js',
        ],
        optional: true
      },
      {
        name: 'babel',
        check: function() { return typeof Babel !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js',
          'https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',
          'https://unpkg.com/@babel/standalone/babel.min.js',
          'https://fastly.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',
        ]
      },
      {
        name: 'xlsx',
        check: function() { return typeof XLSX !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
          'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
          'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
          'https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
        ],
        optional: true
      }
    ];

    // 로딩 상태 표시
    var loadingStatus = document.createElement('div');
    loadingStatus.style.cssText = 'margin-top: 12px; color: #64748b; font-size: 11px; font-family: system-ui;';
    loadingStatus.id = 'cdn-status';

    function setStatus(msg) {
      try { loadingStatus.textContent = msg; } catch (e) {}
    }

    // 순차적으로 라이브러리 로드 (의존성 순서 중요)
    function loadLib(libIndex) {
      if (libIndex >= libs.length) {
        // 모든 라이브러리 로드 완료
        setStatus('모든 라이브러리 로드 완료, 앱 초기화 중...');
        if (typeof window.__startApp === 'function') window.__startApp();
        return;
      }

      var lib = libs[libIndex];

      // 이미 로드된 경우 다음으로
      try {
        if (lib.check()) {
          loadLib(libIndex + 1);
          return;
        }
      } catch (e) {}

      tryUrl(lib, 0, libIndex);
    }

    function tryUrl(lib, urlIndex, libIndex) {
      if (urlIndex >= lib.urls.length) {
        // 모든 CDN 실패
        if (lib.optional) {
          // 선택사항이면 무시하고 다음 라이브러리로
          console.warn('[CDN] ' + lib.name + ' 로드 실패 (선택사항, 무시)');
          loadLib(libIndex + 1);
        } else {
          showError(lib.name);
        }
        return;
      }

      var url = lib.urls[urlIndex];
      var script = document.createElement('script');
      script.crossOrigin = 'anonymous';
      script.src = url;
      setStatus('라이브러리 로드 중: ' + lib.name + ' (' + (urlIndex + 1) + '/' + lib.urls.length + ')');

      script.onload = function() {
        // Tailwind 같은 옵셔널 라이브러리는 onload 발생만으로 성공 처리
        if (lib.optional) {
          try { if (lib.check && !lib.check()) {} } catch(e) {}
          loadLib(libIndex + 1);
          return;
        }
        // 실제로 로드되었는지 확인
        setTimeout(function() {
          try {
            if (lib.check()) {
              loadLib(libIndex + 1);
            } else {
              // 스크립트는 로드됐지만 객체가 안 나타남 - 다음 CDN 시도
              tryUrl(lib, urlIndex + 1, libIndex);
            }
          } catch (e) {
            tryUrl(lib, urlIndex + 1, libIndex);
          }
        }, 50);
      };

      script.onerror = function() {
        // 이 CDN 실패, 다음 CDN 시도
        tryUrl(lib, urlIndex + 1, libIndex);
      };

      document.head.appendChild(script);
    }

    function showError(failedLib) {
      var box = document.getElementById('error-box');
      if (!box) return;
      box.style.display = 'block';
      box.innerHTML =
        '<strong>⚠️ 라이브러리 로드 실패</strong><br>' +
        '<b>' + failedLib + '</b><br><br>' +
        '<b>해결 방법:</b><br>' +
        '• 인터넷 연결을 확인해 주세요<br>' +
        '• 회사 네트워크에서 외부 CDN이 모두 차단된 환경입니다<br>' +
        '• 다른 네트워크(개인 Wi-Fi / 핫스팟)로 시도해 보세요<br>' +
        '• 또는 IT 부서에 다음 도메인 허용 요청:<br>' +
        '&nbsp;&nbsp;cdnjs.cloudflare.com, cdn.jsdelivr.net, unpkg.com';
      var loading = document.getElementById('loading');
      if (loading) loading.classList.add('hide');
    }

    // DOMContentLoaded 후 로드 시작
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        var loading = document.getElementById('loading');
        if (loading) loading.appendChild(loadingStatus);
        loadLib(0);
      });
    } else {
      var loading = document.getElementById('loading');
      if (loading) loading.appendChild(loadingStatus);
      loadLib(0);
    }
  })();
</script>
<style>
  /* === 중국어 한자(CJK Unified Ideographs)만 Microsoft YaHei로 렌더링 === */
  /* 한국어/영어/숫자는 영향 안 받음 */
  @font-face {
    font-family: 'CJKChineseFont';
    src: local('Microsoft YaHei'), local('微软雅黑'), local('PingFang SC'), local('Source Han Sans CN'), local('WenQuanYi Micro Hei'), local('SimHei'), local('SimSun');
    /* CJK Unified Ideographs (한자 기본) + Extension A + Compatibility Ideographs */
    unicode-range: U+4E00-9FFF, U+3400-4DBF, U+F900-FAFF, U+20000-2A6DF, U+2A700-2B73F, U+2B740-2B81F, U+2B820-2CEAF, U+2F800-2FA1F;
    font-display: swap;
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "맑은 고딕", "CJKChineseFont", "Microsoft YaHei", "微软雅黑", "PingFang SC", "Source Han Sans CN", "WenQuanYi Micro Hei", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ===== 컬럼 너비 조절 기능 ===== */
  /* 모든 표 헤더(th)에 우측 드래그 핸들 추가 */
  table th {
    position: relative;
    overflow: visible !important;
  }
  table th .col-resizer {
    position: absolute;
    top: 0;
    right: -3px;
    width: 6px;
    height: 100%;
    cursor: col-resize;
    user-select: none;
    z-index: 10;
    background: transparent;
    transition: background 0.15s;
  }
  table th .col-resizer:hover,
  table th .col-resizer.dragging {
    background: #3b82f6;
  }
  table th .col-resizer::before {
    content: '';
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 50%;
    background: #cbd5e1;
  }
  table th:hover .col-resizer::before {
    background: #94a3b8;
  }
  body.col-resizing {
    cursor: col-resize !important;
    user-select: none !important;
  }
  body.col-resizing * {
    cursor: col-resize !important;
    user-select: none !important;
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f1f5f9; font-family: system-ui, "맑은 고딕", sans-serif; z-index: 9999; }
  #loading.hide { display: none; }
  .spinner { width: 48px; height: 48px; border: 4px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-box { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px 24px; border-radius: 8px; max-width: 600px; font-family: system-ui, sans-serif; z-index: 10000; }

  /* === 표 첫 컬럼 sticky (가로 스크롤 시 고정) — data-sticky-first="off" 표는 제외 === */
  table[data-table-id]:not([data-sticky-first="off"]) thead th:first-child,
  table[data-table-id]:not([data-sticky-first="off"]) tfoot td:first-child {
    position: sticky;
    left: 0;
    z-index: 5;
    background-color: #f1f5f9; /* slate-100 (헤더 회색과 동일) */
  }
  table[data-table-id]:not([data-sticky-first="off"]) tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 4;
    background-color: #ffffff; /* 흰색 */
  }
  /* 호버 시 첫 컬럼도 살짝 강조 */
  table[data-table-id]:not([data-sticky-first="off"]) tbody tr:hover td:first-child {
    background-color: #f8fafc; /* slate-50 */
  }
  /* 첫 컬럼 오른쪽 그림자 (구분감) */
  table[data-table-id]:not([data-sticky-first="off"]) thead th:first-child,
  table[data-table-id]:not([data-sticky-first="off"]) tbody td:first-child,
  table[data-table-id]:not([data-sticky-first="off"]) tfoot td:first-child {
    box-shadow: 1px 0 0 0 #e2e8f0;
  }

  /* === 정렬 가능 헤더 === */
  table[data-table-id] thead th.sortable-header {
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s;
    position: relative;
  }
  table[data-table-id] thead th.sortable-header:hover {
    background-color: #e2e8f0; /* slate-200 */
  }
  table[data-table-id] thead th.sortable-header .sort-icon {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
    color: #94a3b8; /* slate-400 */
    vertical-align: middle;
  }
  table[data-table-id] thead th.sortable-header.sort-asc .sort-icon::after {
    content: '';
    color: #2563eb; /* blue-600 */
  }
  table[data-table-id] thead th.sortable-header.sort-desc .sort-icon::after {
    content: '';
    color: #2563eb; /* blue-600 */
  }
  table[data-table-id] thead th.sortable-header:not(.sort-asc):not(.sort-desc) .sort-icon::after {
    content: '';
    opacity: 0.5;
  }
</style>
</head>
<body class="bg-slate-100">
<div id="loading">
  <div class="spinner"></div>
  <div style="margin-top: 16px; color: #475569; font-size: 14px;">MGG 교육마케팅활동 로딩 중...</div>
  <div style="margin-top: 8px; color: #94a3b8; font-size: 12px;">처음 실행 시 라이브러리 다운로드로 몇 초 걸릴 수 있습니다.</div>
</div>
<div id="error-box"></div>
<div id="root"></div>

<script>
  // 전역 에러 캐치
  window.addEventListener('error', function(e) {
    if (e.message && e.message.indexOf('Script error') === -1) {
      var box = document.getElementById('error-box');
      if (!box) return;
      if (box.style.display !== 'block') {
        box.style.display = 'block';
        box.innerHTML = '<strong>⚠️ 오류 발생</strong><br>' + e.message;
      }
    }
  });

  // CDN 로드 완료 후 호출되는 앱 시작 함수
  // (다중 CDN 폴백 시스템이 모든 라이브러리 로드 후 호출)
  window.__startApp = function() {
    var loading = document.getElementById('loading');
    var babelScript = document.getElementById('app-babel-script');
    if (!babelScript) {
      if (loading) loading.classList.add('hide');
      return;
    }
    try {
      // Babel로 JSX 코드를 변환하여 실행
      var transformed = Babel.transform(babelScript.textContent, {
        presets: ['react']
      }).code;
      var runner = document.createElement('script');
      runner.textContent = transformed;
      document.body.appendChild(runner);
      // 로딩 화면 숨김
      setTimeout(function() {
        if (loading) loading.classList.add('hide');
        // 컬럼 리사이저 시작
        startColumnResizer();
      }, 100);
    } catch (e) {
      var box = document.getElementById('error-box');
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '<strong>⚠️ 앱 시작 실패</strong><br>' + e.message;
      }
      if (loading) loading.classList.add('hide');
    }
  };

  // ===== 컬럼 리사이저 헬퍼 =====
  // 모든 <table>의 <th>에 드래그 핸들을 자동으로 추가합니다.
  // 사용자가 마우스로 끌어서 컬럼 너비를 조절할 수 있습니다.
  // 조절된 너비는 localStorage에 자동 저장되어 새로고침해도 유지됩니다.
  function startColumnResizer() {
    var STORAGE_KEY = 'mggedu_column_widths_v1';

    // 저장된 너비 불러오기
    function loadWidths() {
      try {
        var w = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        // PSI 연간표(psiAnnual_*)는 colgroup 고정 — 저장된 너비 무시
        Object.keys(w).forEach(function(k){ if (k.indexOf('psiAnnual_') === 0 || k.indexOf('sales_emp_progress') === 0 || k.indexOf('bd_entry_status') === 0 || k.indexOf('dso_progress') === 0 || k.indexOf('dso_entry_status') === 0 || k.indexOf('dso_sales_status') === 0) delete w[k]; });
        return w;
      }
      catch (e) { return {}; }
    }

    // 너비 저장
    function saveWidths(widths) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(widths)); }
      catch (e) {}
    }

    // 표 식별자 생성 (위치 기반)
    function getTableId(table) {
      // 표의 첫 번째 헤더 텍스트 + 페이지 내 위치로 식별
      var firstTh = table.querySelector('th');
      var firstHeader = firstTh ? firstTh.textContent.trim().slice(0, 20) : '';
      var allTables = Array.from(document.querySelectorAll('table'));
      var idx = allTables.indexOf(table);
      return 'table_' + idx + '_' + firstHeader.replace(/\s+/g, '_');
    }

    // 컬럼 식별자 (표 ID + 헤더 인덱스)
    function getColId(tableId, thIndex) {
      return tableId + '_col_' + thIndex;
    }

    // 단일 <th>에 리사이저 추가
    function attachResizer(th, thIndex, tableId, widths) {
      // 이미 추가됐으면 스킵
      if (th.querySelector('.col-resizer')) return;
      // colspan 있는 경우는 패스 (멀티헤더 1단)
      if (th.colSpan > 1) return;

      // 저장된 너비 복원
      var colKey = getColId(tableId, thIndex);
      if (widths[colKey]) {
        th.style.width = widths[colKey] + 'px';
        th.style.minWidth = widths[colKey] + 'px';
      }

      // 리사이즈 핸들 생성
      var handle = document.createElement('div');
      handle.className = 'col-resizer';
      th.appendChild(handle);

      // 드래그 이벤트
      var startX, startWidth;
      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        startX = e.clientX;
        startWidth = th.offsetWidth;
        handle.classList.add('dragging');
        document.body.classList.add('col-resizing');

        function onMove(ev) {
          var dx = ev.clientX - startX;
          var newWidth = Math.max(40, startWidth + dx);  // 최소 너비 40px
          th.style.width = newWidth + 'px';
          th.style.minWidth = newWidth + 'px';
        }

        function onUp() {
          handle.classList.remove('dragging');
          document.body.classList.remove('col-resizing');
          // 저장
          var w = loadWidths();
          w[colKey] = th.offsetWidth;
          saveWidths(w);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // 더블클릭 → 너비 리셋
      handle.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        th.style.width = '';
        th.style.minWidth = '';
        var w = loadWidths();
        delete w[colKey];
        saveWidths(w);
      });
    }

    // 모든 표 처리
    function processAllTables() {
      var widths = loadWidths();
      var tables = document.querySelectorAll('table');
      tables.forEach(function(table) {
        // React ResizableHeader를 쓰는 표는 제외 (자체 너비 저장 사용)
        if (table.getAttribute('data-table-id') === 'bd_customers') return;
        if (table.getAttribute('data-table-id') === 'dealer_psi_summary') return;
        // PSI 연간표(대리상별 계약실적현황)는 colgroup으로 고정 — 제외
        var _tid = table.getAttribute('data-table-id') || '';
        if (_tid.indexOf('psiAnnual_') === 0) return;
        if (_tid === 'sales_emp_progress') return;
        if (_tid === 'bd_entry_status') return;
        if (_tid === 'dso_progress') return;
        if (_tid === 'dso_entry_status') return;
        if (_tid === 'dso_sales_status') return;
        if (table.querySelector('thead .cursor-col-resize')) return;

function pExec(){
 const rows=calRows();
 const upto=st.m;
 // 계획 월 분해: 숫자면 그 회차, 문자열이면 1회
 const planCnt=(c,i)=>{const v=c.m[i];return isNum(v)?+v:(v?1:0);};
 const planCost=(c,i)=>{const tc=c.cnt||0, cc=planCnt(c,i);return tc?(c.cost||0)*cc/tc:0;};
 const XG=['세미나교육','마케팅활동'];
 const xShown=shownOf('exSel',XG);
 const gOf=c=>isMkt(c)?'마케팅활동':'세미나교육';
 const gsum=(label,list,cls)=>{
  let s=`<tr class="${cls}"><td style="position:sticky;left:0;background:${cls==='totsel'?'#e0f2fe':'#eef1f5'}">${label}</td>`;
  let pc=0,pv=0,ec=0,ev=0;
  for(let i=0;i<upto;i++){let a=0,b2=0;list.forEach(o=>{a+=planCnt(o.c,i);b2+=planCost(o.c,i);});
   pc+=a;pv+=b2;s+=`<td class="c">${a||''}<div style="font-size:10px;font-weight:400">${b2?wf(b2):''}</div></td>`;}
  list.forEach(o=>{ec+=exSum('A'+o.idx,'c',upto);ev+=exSum('A'+o.idx,'v',upto);});
  s+=`<td class="num">${nf(pc)}</td><td class="num">${wf(pv)}</td><td class="num">${ec?nf(ec):''}</td><td class="num">${ev?wf(ev):''}</td>`
   +`<td>${bar(pv?ev/pv:null)}</td><td></td></tr>`;
  return s;};
 const vis=rows.map((c,idx)=>({c,idx})).filter(o=>xShown.indexOf(gOf(o.c))>=0);
 let body='';let curGrp='';
 let TP={c:0,v:0},TE={c:0,v:0,p:0,r:0};
 vis.forEach(o=>{
  const c=o.c, idx=o.idx;
  const g=gOf(c);
  if(g!==curGrp){
   if(curGrp)body+=gsum(curGrp+' 소계',vis.filter(x=>gOf(x.c)===curGrp),'hl');
   curGrp=g;body+=`<tr class="grp"><td colspan="${7+upto}">${g}</td></tr>`;}
  const id='A'+idx;
  let pc=0,pv=0;
  for(let i=0;i<upto;i++){pc+=planCnt(c,i);pv+=planCost(c,i);}
  const ec=exSum(id,'c',upto), ev=exSum(id,'v',upto), ep=exSum(id,'p',upto), er=exSum(id,'r',upto);
  TP.c+=pc;TP.v+=pv;TE.c+=ec;TE.v+=ev;TE.p+=ep;TE.r+=er;
  const ty=calType(c);
  body+=`<tr>
   <td class="b" style="position:sticky;left:0;background:#fff;z-index:2">
     ${((typeof st!=='undefined'&&st.lang==='zh')?(c.zh||c.ko):c.ko)||'└ 중국투어 추가분'}</td>`;
  for(let i=0;i<upto;i++){
   const p=planCnt(c,i);
   body+=`<td class="mcell ${p?'has':''}">
     <div class="pl">${p?p+'회':''}<span>${p?wf(planCost(c,i)):''}</span></div>
     <div class="in">${num(id,i+1,'c','회')}${num(id,i+1,'v','만')}</div></td>`;
  }
  body+=`<td class="num b">${nf(pc)}</td><td class="num b">${wf(pv)}</td>
    <td class="num ${ec?'':'mut'}">${ec?nf(ec):''}</td><td class="num ${ev?'':'mut'}">${ev?wf(ev):''}</td>
    <td>${bar(pv?ev/pv:null)}</td>
    <td class="c">${(!ec&&!ev)?'미입력':(pv&&ev/pv>1.1?'초과':(pc&&ec<pc*0.8?'지연':'정상'))}</td></tr>`;
 });
 if(curGrp)body+=gsum(curGrp+' 소계',vis.filter(x=>gOf(x.c)===curGrp),'hl');
 if(xShown.length>1)body+=gsum(isSub('exSel')?'선택 항목 합계':'합계',vis,'totsel');

 return `<div class="k5">
   <div class="kpi"><div class="l">1~${upto}월 계획 활동</div><div class="v">${nf(TP.c)}<small>회</small></div><div class="s">연간 378회 중</div></div>
   <div class="kpi"><div class="l">1~${upto}월 계획 비용</div><div class="v">${wf(TP.v)}<small>만</small></div><div class="s">연간 2,495.3만 중</div></div>
   <div class="kpi ${TE.v>TP.v?'r':''}"><div class="l">실행 비용 (입력분)</div><div class="v">${TE.v?wf(TE.v):''}<small>만</small></div><div class="s">진도율 ${TP.v&&TE.v?pf(TE.v/TP.v*100):''}</div></div>
   <div class="kpi"><div class="l">실행 활동</div><div class="v">${TE.c?nf(TE.c):''}<small>회</small></div><div class="s">진도율 ${TP.c&&TE.c?pf(TE.c/TP.c*100):''}</div></div>
   <div class="kpi"><div class="l">실행 참석 / 매출</div><div class="v" style="font-size:17px">${TE.p?nf(TE.p):''}<small>명</small></div><div class="s">매출 ${TE.r?wf(TE.r)+'만':''}</div></div>
 </div>`
 +card('월별 집행관리',
   `기준월 1~${upto}월 · 각 칸 위=계획(회차/비용 만위안), 아래=실행 입력 · 입력 즉시 자동저장`,
  fbar('exSel',XG)
  +`<div class="tw"><table class="ex"><thead><tr>
    <th style="min-width:150px;position:sticky;left:0;background:#e2e8f0;z-index:3">활동</th>
    ${M.slice(0,upto).map(m=>`<th style="min-width:96px">${m}</th>`).join('')}
    <th>계획<br>횟수</th><th>계획<br>비용</th><th>실행<br>횟수</th><th>실행<br>비용</th><th style="width:92px">비용<br>진도율</th><th style="width:70px">판정</th>
   </tr></thead><tbody>${body}</tbody></table></div>
   <p class="fn">※ 계획 비용은 <b>연간 비용 ÷ 연간 횟수 × 그 달 회차</b>로 월 분해한 값. 단일 활동(일자 표기)은 그 달에 전액 배정된다.<br>
   ※ 실행 입력은 <b>횟수·비용</b> 2칸이 기본. 참석·매출은 활동을 클릭해 상세 입력(패키지 활동만 매출 입력 대상).</p>`,'full','c-exec')
 +card('활동별 참석·매출 입력','패키지 연계 활동 · 매출은 판매월 기준으로 입력',
  `<div class="tw"><table><thead><tr><th style="min-width:150px">활동</th><th>계획 인원</th><th>계획 매출</th>
    ${M.slice(0,upto).map(m=>`<th style="min-width:120px">${m} 참석/매출</th>`).join('')}
    <th>실참석</th><th>실매출</th><th style="width:90px">매출 진도</th></tr></thead><tbody>
   ${vis.filter(o=>o.c.rev).map(o=>{const c=o.c,idx=o.idx;const id='A'+idx;
     const ep=exSum(id,'p',upto),er=exSum(id,'r',upto);
     return `<tr><td class="b">${((typeof st!=='undefined'&&st.lang==='zh')?(c.zh||c.ko):c.ko)||'└ 중국투어 추가분'}</td><td class="num">${nf(c.ppl)}</td><td class="num">${nf(c.rev)}</td>
      ${M.slice(0,upto).map((_,j)=>`<td class="c" style="padding:2px">${num(id,j+1,'p','명')}${num(id,j+1,'r','매출만')}</td>`).join('')}
      <td class="num b">${ep?nf(ep):''}</td><td class="num b">${er?wf(er):''}</td>
      <td>${bar(c.rev&&er?er/c.rev:null)}</td></tr>`;}).join('')}
   </tbody></table></div>`,'full','c-exrev');
}

 if(!document.getElementById('nav')){ if(window.MP&&MP.onRender)MP.onRender(); return; }
 document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${st.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 const showEnt=['cal','edu','pkg'].includes(st.tab);
 const showM=(st.tab==='exec'||st.tab==='plan');
 document.getElementById('entWrap').style.display=showEnt?'':'none';
 document.getElementById('mWrap').style.display=showM?'':'none';
 document.getElementById('entSeg').innerHTML=[['all','전체'],['nb','닝보'],['bj','북경']]
   .map(e=>`<button class="${st.ent===e[0]?'on':''}" onclick="setEnt('${e[0]}')">${e[1]}</button>`).join('');
 const sel=document.getElementById('selM');
 sel.innerHTML=M.map((m,i)=>`<option value="${i+1}" ${st.m===i+1?'selected':''}>${m}까지</option>`).join('');
 sel.onchange=e=>{st.m=+e.target.value;save();render();};
 const P={plan:pPlan,cal:pCal,edu:pEdu,pkg:pPkg,exec:pExec};

function go(t){st.tab=t;save();render();}
function setEnt(e){st.ent=e;save();render();}
function bind(root){
 root=root||document;
 root.querySelectorAll('[data-edit]').forEach(el=>{
  el.addEventListener('dblclick',()=>{el.contentEditable='true';el.classList.add('editing');el.focus();});
  el.addEventListener('blur',()=>{if(el.contentEditable!=='true')return;el.contentEditable='false';el.classList.remove('editing');
   TXT[el.getAttribute('data-edit')]=el.innerText.trim();store.set('mkplan_txt_v1',TXT);el.classList.add('edited');});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur();}});
 });
 root.querySelectorAll('.nv').forEach(el=>{
  el.addEventListener('click',(evt)=>{evt.stopPropagation();if(el.isContentEditable)return;
   el.contentEditable='true';el.classList.add('editing');
   const b=el.getAttribute('data-base');const p=el.getAttribute('data-ovr');
   el.textContent=(p in OVR)?OVR[p]:(b===''?'':b);
   el.focus();document.execCommand&&document.execCommand('selectAll',false,null);});
  el.addEventListener('blur',()=>{if(el.contentEditable!=='true')return;
   el.contentEditable='false';el.classList.remove('editing');
   const p=el.getAttribute('data-ovr'), b=el.getAttribute('data-base');
   const raw=el.textContent.trim().replace(/,/g,'');
   const base=b===''?null:parseFloat(b);
   if(raw===''||raw==='-'){setOv(p,null);} else {const v=parseFloat(raw);
    if(isNaN(v)){} else if(base!=null&&Math.abs(v-base)<1e-9){setOv(p,null);} else setOv(p,v);}
   render();});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}
   if(e.key==='Escape'){el.contentEditable='false';el.classList.remove('editing');render();}});
 });
 root.querySelectorAll('td[data-info]').forEach(td=>{
  td.addEventListener('click',(e)=>{e.stopPropagation();
   const old=document.getElementById('mpPop'); if(old)old.remove();
   const d=document.createElement('div'); d.id='mpPop'; d.className='pop';
   d.innerHTML='<b>'+(td.getAttribute('data-hd')||'')+'</b>'+td.getAttribute('data-info');
   document.body.appendChild(d);
   const r=td.getBoundingClientRect();
   d.style.left=Math.max(8,Math.min(window.innerWidth-d.offsetWidth-8,r.left+window.scrollX-40))+'px';
   d.style.top=(r.bottom+window.scrollY+6)+'px';
   const off=()=>{d.remove();document.removeEventListener('click',off);};
   setTimeout(()=>document.addEventListener('click',off),0);});
 });
 root.querySelectorAll('input[data-ex]').forEach(inp=>{
  inp.addEventListener('change',()=>{
   const [id,m,f]=inp.getAttribute('data-ex').split('|');
   const v=inp.value.trim();
   setEx(id,+m,f,v===''?null:parseFloat(v.replace(/,/g,'')));
   render();});
 });
}
render();

function exeRows(){try{const v=localStorage.getItem('mggedu_seminarPlan_v1');return v?JSON.parse(v):[];}catch(e){return [];}}
function pCmp(){
 const EDR=[].concat.apply([],EDUTAX.map(g=>g.kids.map(k=>calRowOf(k[2]))));
 const mv2=(c,i)=>{const v=c.m[i];return isNum(v)?+v:(v?1:0);};
 const pM=i=>EDR.reduce((s,c)=>s+mv2(c,i),0);
 const pShare=(c,i)=>{const t=ov('cal|'+c.r+'|cnt',c.cnt)||0;return t?mv2(c,i)/t:0;};
 const pPplM=i=>EDR.reduce((s,c)=>s+(ov('cal|'+c.r+'|ppl',c.ppl)||0)*pShare(c,i),0);
 const pCostM=i=>EDR.reduce((s,c)=>s+(ov('cal|'+c.r+'|cost',c.cost)||0)*pShare(c,i),0);

 const aM=i=>rows.filter(r=>(r.yearMonth||'')==='2026-'+(i+1));
 const sm=(a,f)=>a.reduce((s,r)=>s+(+r[f]||0),0);
 const rt=(a,b)=>(a&&b)?`${(a/b*100).toFixed(0)}%`:'';
 let body='';let T={pc:0,ac:0,pp:0,ap:0,pv:0,av:0,nc:0};
 monIdx().forEach(i=>{
  const g=aM(i), pc=pM(i), ac=g.length, pp=pPplM(i), ap=sm(g,'people'), pv=pCostM(i), av=sm(g,'cost'), nc=sm(g,'newCust');
  T.pc+=pc;T.ac+=ac;T.pp+=pp;T.ap+=ap;T.pv+=pv;T.av+=av;T.nc+=nc;
  body+=`<tr><td class="c b">${M[i]}</td>

 body+=`<tr class="totsel"><td class="c b">합계</td>

 return `<div class="k5">

   <div class="kpi"><div class="l">신규 고객</div><div class="v">${nf(T.nc)}<small>개소</small></div><div class="s">실행 기록 기준</div></div>
 </div>`

/* ================= 마케팅활동 대비 실행 (계획=마케팅 캘린더 / 실행=월별 집행관리 입력) ================= */
function mktRows(){return calRows().map((c,i)=>({c,i})).filter(o=>isMkt(o.c));}
function pMcmp(){
 const R=mktRows();
 const mv2=(c,i)=>{const v=c.m[i];return isNum(v)?+v:(v?1:0);};
 const shr=(c,i)=>{const t=ov('cal|'+c.r+'|cnt',c.cnt)||0;return t?mv2(c,i)/t:0;};
 const pC=i=>R.reduce((s,o)=>s+mv2(o.c,i),0);
 const pV=i=>R.reduce((s,o)=>s+(ov('cal|'+o.c.r+'|cost',o.c.cost)||0)*shr(o.c,i),0);
 const pP=i=>R.reduce((s,o)=>s+(ov('cal|'+o.c.r+'|ppl',o.c.ppl)||0)*shr(o.c,i),0);
 const pR=i=>R.reduce((s,o)=>s+(ov('cal|'+o.c.r+'|rev',o.c.rev)||0)*shr(o.c,i),0);
 const aF=(i,f)=>R.reduce((s,o)=>{const v=ex('A'+o.i,i+1,f);return s+(v?+v:0);},0);
 const rt=(a,b)=>(a&&b)?`${(a/b*100).toFixed(0)}%`:'';
 let body='';let T={pc:0,ac:0,pv:0,av:0,pp:0,ap:0,pr:0,ar:0};
 monIdx().forEach(i=>{
  const pc=pC(i),ac=aF(i,'c'),pv=pV(i),av=aF(i,'v'),pp=pP(i),ap=aF(i,'p'),pr=pR(i),ar=aF(i,'r');
  T.pc+=pc;T.ac+=ac;T.pv+=pv;T.av+=av;T.pp+=pp;T.ap+=ap;T.pr+=pr;T.ar+=ar;
  body+=`<tr><td class="c b">${M[i]}</td>
   <td class="num">${pc?nf(pc):''}</td><td class="num b">${ac?nf(ac):''}</td><td class="c">${rt(ac,pc)}</td>
   <td class="num">${pv?wf(pv):''}</td><td class="num b">${av?wf(av):''}</td><td class="c">${rt(av,pv)}</td>
   <td class="num">${pp?nf(pp):''}</td><td class="num b">${ap?nf(ap):''}</td>
   <td class="num">${pr?nf(pr):''}</td><td class="num b">${ar?nf(ar):''}</td><td class="c">${rt(ar,pr)}</td></tr>`;});
 body+=`<tr class="totsel"><td class="c b">합계</td>
  <td class="num b">${nf(T.pc)}</td><td class="num b">${nf(T.ac)}</td><td class="c b">${rt(T.ac,T.pc)}</td>
  <td class="num b">${wf(T.pv)}</td><td class="num b">${wf(T.av)}</td><td class="c b">${rt(T.av,T.pv)}</td>
  <td class="num b">${nf(T.pp)}</td><td class="num b">${nf(T.ap)}</td>
  <td class="num b">${nf(T.pr)}</td><td class="num b">${nf(T.ar)}</td><td class="c b">${rt(T.ar,T.pr)}</td></tr>`;

 const mv2=(c,i)=>{const v=c.m[i];return isNum(v)?+v:(v?1:0);};

 const mons=monIdx();
 let body='';let TP=0,TA=0;
 R.forEach(o=>{const c=o.c;const pr=ov('cal|'+c.r+'|rev',c.rev)||0;
  const ar=mons.reduce((s,i)=>{const v=ex('A'+o.i,i+1,'r');return s+(v?+v:0);},0);
  const prShown=mons.reduce((s,i)=>s+pr*shr(c,i),0);
  TP+=prShown;TA+=ar;

 body+=`<tr class="totsel"><td class="b">합계</td><td></td>
  ${mons.map(i=>`<td class="num b">${nf(R.reduce((s,o)=>s+(ov('cal|'+o.c.r+'|rev',o.c.rev)||0)*shr(o.c,i),0))}</td>`).join('')}

 </div>`

 const V=(o,f)=>ov('pkg|'+o.i+'|'+f,o.p[f])||0;
 const agg=list=>list.reduce((a,o)=>({cnt:a.cnt+V(o,'cnt'),p:a.p+V(o,'ppl'),q:a.q+V(o,'qty'),
   r:a.r+V(o,'rev'),c:a.c+V(o,'cost')}),{cnt:0,p:0,q:0,r:0,c:0});
 const srow=(label,a,cls)=>`<tr class="${cls}"><td colspan="6" class="b">${label}</td>

 let body='', allList=[], seq=0;
 gShown.forEach(g=>{const list=gv(g); if(!list.length)return; allList=allList.concat(list);
  list.forEach(o=>{const p=o.p,i=o.i;seq++;

   body+=`<tr><td class="c">${seq}</td><td class="b">${p.item||g}</td><td>${ed('pkgreg|'+i,p.reg||'')}</td>

  body+=srow(g+' 소계',agg(list),'hl');});
 const T=agg(allList);
 if(gShown.length>1)body+=srow(isSub('pkgSel')?`선택 항목 합계 (${gShown.length}/${PG.length}개 항목)`:'합계',T,'totsel');

  `<div class="tw"><table><thead><tr>
    <th style="width:34px">No</th><th style="min-width:110px">항목</th><th style="min-width:110px">지역</th><th style="width:56px">법인</th>
    <th style="width:72px">판매일정</th><th style="width:66px">행사일정</th>
    <th>횟수</th><th>인원</th><th>PKG<br>수량</th><th>PKG<br>단가</th><th>매출<br>만위안</th>
    <th>비용<br>단가</th><th>비용<br>만위안</th><th style="width:60px">ROI(배)</th></tr></thead>
   <tbody>${body}</tbody></table></div>

function wkUpload(inp){
 const f=inp.files&&inp.files[0]; if(!f)return;
 if(typeof XLSX==='undefined'){alert('엑셀 라이브러리를 불러오지 못했습니다.');return;}
 const rd=new FileReader();
 rd.onload=e=>{try{
  const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  const name=wb.SheetNames.find(n=>n.indexOf('培训班调研')>=0);
  if(!name){alert('「培训班调研」 시트를 찾지 못했습니다.');return;}
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''});
  const CITY=PD.wkmap&&PD.wkmap.city||{}, HQM=PD.wkmap&&PD.wkmap.hq||{}, CAT=PD.wkmap&&PD.wkmap.cat||{};
  const S=v=>String(v==null?'':v).trim();
  const N=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isNaN(x)?0:x;};
  const reg=z=>z==='全国'?'전국':S(z).replace('大区','지역');
  const mn=z=>{const m=S(z).match(/(\d{1,2})/);return m?+m[1]:0;};
  let act=[],rev=[],mode=0;
  aoa.forEach(r=>{
   const c0=S(r[0]);
   if(c0.indexOf('本周活动')>=0){mode=1;return;}
   if(c0.indexOf('本周新增销售额')>=0){mode=2;return;}
   if(c0==='月份')return;
   if(!c0)return;
   if(mode===1&&N(r[7])>0){const city=S(r[3]);
    act.push({m:c0,mn:mn(c0),date:S(r[1]),reg:reg(S(r[2])),regZh:S(r[2]),city:CITY[city]||city,cityZh:city,
      hq:HQM[CITY[city]||city]||'미배정',cat:CAT[S(r[4])]||S(r[4]),catZh:S(r[4]),topic:S(r[5]),topicZh:S(r[5]),lec:S(r[6]),
      cost:N(r[7]),ppl:N(r[8]),sale:N(r[9])});}
   if(mode===2&&S(r[11])!==''){const city=S(r[4]);
    rev.push({m:c0,mn:mn(c0),date:S(r[1]),reg:reg(S(r[2])),regZh:S(r[2]),prov:S(r[3]),city:CITY[city]||city,cityZh:city,
      hq:HQM[CITY[city]||city]||'미배정',cat:CAT[S(r[5])]||S(r[5]),catZh:S(r[5]),topic:S(r[6]),topicZh:S(r[6]),lec:S(r[7]),
      dealer:S(r[8]),dealerZh:S(r[8]),ppl:N(r[9]),nc:(S(r[10])==='/'?0:N(r[10])),ncRaw:S(r[10]),amt:N(r[11])});}
  });
  if(!act.length&&!rev.length){alert('데이터를 읽지 못했습니다. 시트 양식을 확인해 주세요.');return;}
  const lab=(name.match(/[（(]([^）)]+)[）)]/)||[])[1]||f.name.replace(/\.[^.]+$/,'');
  const mo=mn(lab)|| (act[0]&&act[0].mn) || (rev[0]&&rev[0].mn) || 0;
  const key='2026-'+String(mo).padStart(2,'0')+'-'+lab;
  const w={key:key,label:mo+'월 ('+lab+')',labelZh:mo+'月 ('+lab+')',month:mo,act:act,rev:rev};
  const list=wkAll().filter(x=>x.key!==key&&x.key!==PD.wk.key);
  wkSave([w].concat(list));
  st.wkKey=key;save();render();
  alert('저장되었습니다 — '+w.label+' · 활동 '+act.length+'건 / 신규매출 '+rev.length+'건');
 }catch(err){alert('파일을 읽는 중 오류가 발생했습니다: '+err.message);}};
 rd.readAsArrayBuffer(f);
}

  const zh=st.lang==='zh';
  const map=zh?ZHD:ZHR;
  const root=document.body; if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const arr=[]; while(w.nextNode())arr.push(w.currentNode);
  arr.forEach(n=>{
   const p=n.parentNode; if(!p)return;
   const tg=p.nodeName;
   if(tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA'||tg==='INPUT'||tg==='OPTION')return;
   const raw=n.nodeValue; const k=raw.trim(); if(!k||k.length>28)return;
   const v=map[k]; if(v)n.nodeValue=raw.replace(k,v);
  });
 }catch(e){}
}

(function normalizeIds() {

  const fix = (byHQ, prefix) => {
    Object.keys(byHQ).forEach(h => {
      (byHQ[h] || []).forEach(r => {
        if (r && (r.id === undefined || r.id === null || typeof r.id === 'number')) {

const formatNumber = (n) => typeof n !== 'number' ? n : n.toLocaleString('ko-KR');

// === 주차 옵션 (2026년 1주차 ~ 2028년 52주차, 총 156주) ===
const WEEK_OPTIONS = (() => {
  const opts = [];
  // 52주 → 12개월로 단순 매핑
  // 1~4주: 1월 1~4주차 / 5~8주: 2월 1~4주차 / ... / 49~52주: 12월 1~4주차
  // (5번째 주차는 다음 달의 1주차로 자연스럽게 흘러가도록 일부 월은 5주차 포함)
  for (let year = 2026; year <= 2028; year++) {
    for (let week = 1; week <= 52; week++) {
      // 단순 매핑: week를 4.33으로 나눠서 월 결정 (1~12월)
      const month = Math.min(12, Math.ceil(week / 4.333));
      // 해당 월 안에서 몇 번째 주차인지
      const monthStartWeek = Math.ceil((month - 1) * 4.333) + 1;
      const weekInMonth = week - monthStartWeek + 1;
      opts.push({
        value: `${year}-${String(week).padStart(2, '0')}`,
        label: `${year}년 ${month}월 ${weekInMonth}주차`,
        year,
        week,
        month,
        weekInMonth,
      });
    }
  }
  return opts;
})();

// 주차 값에서 연도/주차 분리
function parseWeekValue(weekStr) {
  if (!weekStr || typeof weekStr !== 'string') return { year: 2026, week: 1 };
  const [y, w] = weekStr.split('-');
  return { year: parseInt(y) || 2026, week: parseInt(w) || 1 };
}

/* ================ 공통 컴포넌트 ================ */
function EditableCell({ value, onSave, type = 'text', align = 'left', suffix = '', placeholder = '', className = '', multiline = false }) {
  const [editing, setEditing] = useState(false);
  const [temp, setTemp] = useState(value);
  useEffect(() => { setTemp(value); }, [value]);

  const handleSave = () => {
    let v = temp;
    if (type === 'number') { v = parseFloat(temp); if (isNaN(v)) v = 0; }
    onSave(v);
    setEditing(false);
  };

  const alignClass = align === 'right' ? 'text-right' : align === 'center' ? 'text-center' : 'text-left';

  if (editing) {
    if (multiline) {
      return <textarea value={temp} autoFocus placeholder={placeholder} rows={3}
        onChange={(e) => setTemp(e.target.value)} onBlur={handleSave}
        onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleSave(); if (e.key === 'Escape') { setTemp(value); setEditing(false); }}}
        className={`w-full px-1.5 py-1 border border-blue-400 rounded outline-none text-slate-900 resize-y ${alignClass}`} style={{ minHeight: '3.5em', whiteSpace: 'pre-wrap' }} />;
    }
    return <input type={type === 'number' ? 'number' : 'text'} step="0.1" value={temp} autoFocus placeholder={placeholder}
      onChange={(e) => setTemp(e.target.value)} onBlur={handleSave}
      onKeyDown={(e) => { if (e.key === 'Enter') handleSave(); if (e.key === 'Escape') { setTemp(value); setEditing(false); }}}
      className={`w-full px-1 py-0.5 border border-blue-400 rounded outline-none text-slate-900 ${alignClass}`} />;
  }

  const isEmpty = value === '' || value === null || value === undefined;
  if (multiline) {
    return (
      <div onClick={() => setEditing(true)}
        className={`cursor-pointer hover:bg-blue-50 px-2 py-1 rounded ${alignClass}`}
        style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }} title="클릭하여 수정">
        {isEmpty ? <span className="text-slate-400 italic">{placeholder || ''}</span> : value}{!isEmpty && suffix}
      </div>
    );
  }
  // className이 지정되면 커스텀 스타일 사용 (배너 등), 아니면 기본 스타일
  if (className) {
    return (
      <span onClick={() => setEditing(true)}
        className={`cursor-pointer hover:opacity-75 ${className}`} title="클릭하여 수정">
        {isEmpty ? <span className="opacity-60 italic">{placeholder || '입력'}</span> : (typeof value === 'number' ? (value % 1 === 0 ? formatNumber(value) : value.toFixed(1)) : value)}{!isEmpty && suffix}
      </span>
    );
  }
  return (
    <div onClick={() => setEditing(true)}
      className={`cursor-pointer hover:bg-blue-50 px-2 py-1 rounded ${alignClass}`} title="클릭하여 수정">
      {isEmpty ? <span className="text-slate-400 italic">{placeholder || ''}</span> : (typeof value === 'number' ? (value % 1 === 0 ? formatNumber(value) : value.toFixed(1)) : value)}{!isEmpty && suffix}
    </div>
  );
}

function NoteBoard({ noteKey, weeklyEntries, setWeeklyEntries, label }) {

  const collapseKey = 'mggedu_noteCollapse|' + noteKey;

    try { const v = localStorage.getItem(collapseKey); if (v !== null) return v === '1'; } catch(e){}

  });
  React.useEffect(()=>{ try{ localStorage.setItem(collapseKey, collapsed?'1':'0'); }catch(e){} }, [collapsed, collapseKey]);
  // 저장값: JSON 배열. 기존 단일 텍스트가 있으면 첫 항목으로 마이그레이션.
  const raw = weeklyEntries[noteKey];
  const items = React.useMemo(() => {
    if (raw === undefined || raw === null || raw === '') return [];
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    } catch(e) {}
    // 옛 단일 텍스트 → 항목 1개로 변환
    return [{ id: 'mig'+Date.now(), type:'note', text: String(raw), done:false, pinned:false, color:'', bold:false }];
  }, [raw]);

  const save = (next) => setWeeklyEntries(prev => ({ ...prev, [noteKey]: JSON.stringify(next) }));
  const add = (type) => {
    const it = { id: 'n'+Date.now()+Math.random().toString(36).slice(2,5), type, text:'', done:false, pinned:false, color:'', bold:false };
    save([...items, it]);
  };
  const upd = (id, patch) => save(items.map(it => it.id===id ? {...it, ...patch} : it));
  const del = (id) => save(items.filter(it => it.id!==id));

  // 핀 우선 정렬
  const sorted = [...items].sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));

  const colors = [
    { key:'', label:'기본', cls:'bg-white' },
    { key:'amber', label:'주황', cls:'bg-amber-50 border-amber-200' },
    { key:'rose', label:'빨강', cls:'bg-rose-50 border-rose-200' },
    { key:'blue', label:'파랑', cls:'bg-blue-50 border-blue-200' },
    { key:'green', label:'초록', cls:'bg-emerald-50 border-emerald-200' },
  ];
  const colorCls = (c) => (colors.find(x=>x.key===c)||colors[0]).cls;

  const AutoText = ({ value, onSave, bold, placeholder }) => {
    const [t, setT] = React.useState(value);
    React.useEffect(()=>setT(value),[value]);
    const ref = React.useRef(null);
    const fit = (el) => { if(el){ el.style.height='auto'; el.style.height=Math.max(28, el.scrollHeight)+'px'; } };
    return <textarea ref={(el)=>{ref.current=el; fit(el);}} value={t}
      onChange={e=>{ setT(e.target.value); fit(e.target); }}
      onBlur={()=>onSave(t)}
      placeholder={placeholder}
      className={"w-full bg-transparent outline-none resize-none text-sm leading-relaxed "+(bold?'font-bold':'')}
      style={{minHeight:'28px', overflow:'hidden'}} />;
  };

  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <button onClick={()=>setCollapsed(!collapsed)} className="flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-slate-900">
          <span className="inline-block w-3 text-center">{collapsed ? '▶' : '▼'}</span>
          메모 / 할 일
          {items.length>0 && <span className="text-slate-400 font-normal">({items.length})</span>}
        </button>
        {!collapsed && (<>
          <button onClick={()=>add('note')} className="px-2 py-1 text-xs border border-slate-300 rounded hover:bg-slate-50">+ 메모</button>
          <button onClick={()=>add('todo')} className="px-2 py-1 text-xs border border-slate-300 rounded hover:bg-slate-50">+ 할 일</button>
        </>)}
        {items.filter(i=>i.type==='todo'&&!i.done).length>0 && <span className="text-[11px] text-amber-600">미완료 할 일 {items.filter(i=>i.type==='todo'&&!i.done).length}개</span>}
      </div>
      {!collapsed && (sorted.length===0 ? (
        <div className="text-sm text-slate-400 py-4 text-center border border-dashed border-slate-200 rounded-md">메모나 할 일을 추가하세요.</div>
      ) : (
        <div className="flex flex-col gap-2">
          {sorted.map(it => (
            <div key={it.id} className={"border rounded-md p-2 flex items-start gap-2 "+colorCls(it.color)+(it.pinned?' border-l-4':'')}>
              {it.type==='todo' && (
                <input type="checkbox" checked={!!it.done} onChange={()=>upd(it.id,{done:!it.done})} className="mt-1.5 cursor-pointer flex-shrink-0" />
              )}
              <div className="flex-1 min-w-0">
                <div className={it.done?'line-through text-slate-400':''}>
                  <AutoText value={it.text} bold={it.bold} placeholder={it.type==='todo'?'할 일 입력...':'메모 입력...'} onSave={(v)=>upd(it.id,{text:v})} />
                </div>
              </div>
              <div className="flex items-center gap-0.5 flex-shrink-0">
                <button onClick={()=>upd(it.id,{pinned:!it.pinned})} title="고정" className={"text-xs px-1 rounded hover:bg-slate-100 "+(it.pinned?'text-amber-500':'text-slate-300')}>📌</button>
                <button onClick={()=>upd(it.id,{bold:!it.bold})} title="굵게" className={"text-xs px-1 rounded hover:bg-slate-100 font-bold "+(it.bold?'text-slate-900':'text-slate-300')}>B</button>
                <select value={it.color} onChange={e=>upd(it.id,{color:e.target.value})} title="색상" className="text-xs border-0 bg-transparent cursor-pointer text-slate-400 hover:text-slate-700 w-7">
                  {colors.map(c=><option key={c.key} value={c.key}>{c.key===''?'○':'●'}</option>)}
                </select>
                <button onClick={()=>del(it.id)} title="삭제" className="text-xs px-1 rounded hover:bg-slate-100 text-slate-300 hover:text-rose-600">✕</button>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ===== 중국법인(전체) 집계/분배 헬퍼 ===== */
// 배열형 데이터(패키지·세미나)용.
// 중국법인 화면에서는 모든 본부의 행을 _hq 태그와 함께 모아 보여주고,
// 추가/수정/삭제는 각 행의 _hq(본부) 로 라우팅한다. → 각 본부 화면에 그대로 반영.
function aggRows(dataByHQ, hq) {
  if (hq === AGG_HQ) {
    const out = [];
    REAL_HQS.forEach(h => (dataByHQ[h] || []).forEach(r => out.push({ ...r, _hq: h })));
    return out;
  }
  return (dataByHQ[hq] || []).map(r => ({ ...r, _hq: hq }));
}
// 특정 행(id)이 실제로 속한 본부 찾기 (중국법인 편집 시)
function ownerHQ(dataByHQ, hq, id) {
  if (hq !== AGG_HQ) return hq;
  for (const h of REAL_HQS) {
    if ((dataByHQ[h] || []).some(r => r.id === id)) return h;
  }
  return REAL_HQS[0];
}

// 집계 행을 법인(닝보/북경) → 본부 순으로 정렬하고, 각 행에 법인 태그(_corp)를 붙인다.
// 반환: 정렬된 행 배열. 소계 삽입은 렌더에서 _corp 경계로 판단.
function sortByCorpHQ(rows) {
  const corpIdx = (c) => { const i = CORP_LIST.indexOf(c); return i < 0 ? 99 : i; };
  const hqIdx = (h) => { const i = REAL_HQS.indexOf(h); return i < 0 ? 99 : i; };
  return rows.map(r => ({ ...r, _corp: HQ_CORP[r._hq] || '기타' }))
    .sort((a, b) => {
      const ca = corpIdx(a._corp), cb = corpIdx(b._corp);
      if (ca !== cb) return ca - cb;
      const ha = hqIdx(a._hq), hb = hqIdx(b._hq);
      return ha - hb;
    });
}

};
var SEM_HQ_OF = {};
Object.keys(SEM_CITY_HQ).forEach(function(h){ SEM_CITY_HQ[h].forEach(function(c){ SEM_HQ_OF[c] = h; }); });
function normSem(rows){
  if(!Array.isArray(rows)) return rows;
  return rows.map(function(r){
    var o = Object.assign({}, r);
    var it = String(o.item||'');
    if (it.indexOf('网课') >= 0) { o.city = '在线'; o.cityKr = '온라인'; o.hq = '닝보·북경'; o.corp = '닝보·북경'; }
    else if (it.indexOf('国际活动') >= 0) { o.hq = '닝보·북경'; o.corp = '닝보·북경'; }
    else if (it === 'KOL活动' || String(o.topic||'').indexOf('KOL韩国') >= 0) { o.city = '韩国大邱'; o.cityKr = '한국 대구'; }
    if (!o.hq || o.hq === '미배정') {
      var h = SEM_HQ_OF[o.cityKr] || SEM_HQ_OF[o.city];
      if (h && (!o.corp || HQ_CORP[h] === o.corp)) o.hq = h;
    }
    return o;
  });
}

    const rawJson = JSON.stringify(payload);
    const rawMB = rawJson.length / 1048576;
    let bodyStr, sizeMB, compressed = false;
    if (typeof LZString !== 'undefined') {
      bodyStr = JSON.stringify({ action: 'save', payload: { _z: true, _c: LZString.compressToBase64(rawJson) } });
      sizeMB = bodyStr.length / 1048576; compressed = true;
    } else {
      bodyStr = JSON.stringify({ action: 'save', payload: payload });
      sizeMB = bodyStr.length / 1048576;
    }
    const sizeInfo = compressed ? `원본 ${rawMB.toFixed(2)}MB → 압축 ${sizeMB.toFixed(2)}MB` : `${sizeMB.toFixed(2)}MB (압축 미적용)`;
    if (sizeMB > 8 && !confirm(`⚠️ 저장 데이터가 ${sizeMB.toFixed(1)}MB로 큽니다.\n일부가 잘릴 수 있습니다. 그래도 저장할까요?`)) return;
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: bodyStr });
      let ok = false, errMsg = '';
      try { const j = await res.json(); ok = j.ok !== false; errMsg = j.error || ''; } catch (e) { ok = res.ok; }
      if (ok) {
        localStorage.setItem('mggedu_last_cloud_save', new Date().toISOString());
        setCloudAt(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })); setCloudState('ok');
        if (!silent) alert('✅ 클라우드 저장 완료!\n저장 시각: ' + new Date().toLocaleString('ko-KR') + '\n' + sizeInfo);
      } else {
        setCloudState('err');
        if (!silent) alert('❌ 저장 실패' + (errMsg ? ': ' + errMsg : ''));
      }
    } catch (e) {
      try {
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: bodyStr });
        localStorage.setItem('mggedu_last_cloud_save', new Date().toISOString());
        setCloudAt(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })); setCloudState('ok');
        if (!silent) alert('✅ 전송 완료 (응답 확인 불가 모드)\n' + sizeInfo + '\n\n⚠️ [클라우드 불러오기]로 정상 저장 여부를 확인해 주세요.');
      } catch (e2) { setCloudState('err'); if (!silent) alert('❌ 저장 실패: ' + e2.message); }
    }
  };

      });
      return (
        <Card title="예산 — 계획(활동) ↔ 예산 ↔ 실적 3단 매칭" hint={`북경법인 ${PLBL} · 활동 계획 합계 = 과목 예산 (1~9월 오차 0원 검증) · 단위 RMB`}>

              </tr></thead>
              <tbody>
                {blocks.map(b => { const ko=(MK_KM.bj[b.ac]||[b.ac])[0];
                  const tb=b.bd.reduce((s,x)=>s+x,0), ta=b.at.reduce((s,x)=>s+(x||0),0); const rr=tb?ta/tb:null;
                  return (<React.Fragment key={b.ac}>
                    <tr className="bg-blue-50"><td className={tdl+" font-bold text-blue-800 text-xs"} colSpan={ms.length+3}>{ko} <span className="font-normal" style={{fontFamily:'"Microsoft YaHei",sans-serif'}}>{b.ac}</span></td></tr>
                    {b.rws.map(([nm,v],j)=>(
                      <tr key={j} className="bg-slate-50/40">
                        <td className={tdl+" text-xs text-slate-600 pl-5"}>{nm}</td>
                        {ms.map(m=><td key={m} className={tdn+" text-xs "+((v[m-1])?'':'text-slate-300')}>{v[m-1]?nf(v[m-1]):'·'}</td>)}
                        <td className={tdn+" text-xs"}>{nf(ms.reduce((s,m)=>s+v[m-1],0))}</td>

                      <td className={tdn+" bg-blue-50"}>{nf(tb)}</td>

                    <tr className="font-bold">
                      <td className={tdl}>실적</td>

                      <td className={tdc}>{rr==null?'—':<span className={`text-[11px] font-semibold px-1.5 border ${rr>1.2?'text-rose-600 border-rose-300':rr>1?'text-amber-600 border-amber-300':'text-slate-600 border-slate-300'}`}>{Math.round(rr*100)}%</span>}</td>

                    <tr>
                      <td className={tdl+" text-xs text-slate-500"}>차이 (실적−계획)</td>

                        return <td key={i} className={tdn+" text-xs "+(d>0?'text-rose-600 font-semibold':d<0?'text-emerald-600 font-semibold':'text-slate-400')}>{d>0?'+':''}{nf(d)}</td>; })}

                          return <td key={m} className={tdc+" text-[11px]"}>{c?<span>{c}회<div className="text-slate-500">{nf(a/c)}</div></span>:<span className="text-slate-300">·</span>}</td>; })}

            </Card>

          <Card title="과목 → 표준 카테고리 매핑" hint="항목별 비교의 기준 · 예외 계상은 편차 사유에 기록">

                </tr></thead>
                <tbody>{mapRows.map((r,i)=>(

                    <td className={tdl} style={{fontFamily:'"Microsoft YaHei",sans-serif'}}>{r.a}</td>
                    <td className={tdl}>{r.ko}</td>
                    <td className={tdl}><i className="inline-block w-2 h-2 mr-1.5" style={{background:MK_CATCOL[r.cat]}}></i>{r.cat}</td>

              </table>
            </div>
          </Card>
        </div>

    const TABS = MK_TABS;
    const bodyFor = { dept: tabDept, comp: tabComp, acct: tabAcct, budget: tabBudget, acts: tabActs };

    return (
      <div className="space-y-4">
        {/* 조건바 */}
        <div className="bg-white border border-slate-200 rounded-md px-3 py-2 flex items-center gap-3 flex-wrap">
          <Icon name="calendar" className="w-4 h-4 text-slate-400" />
          <span className="text-xs text-slate-500 font-semibold">연도</span>
          <Seg opts={[[25,'25년'],[26,'26년']]} val={mkYear} on={(v)=>{ setMkYear(v); if (mkMonth > (v===25?12:9)) setMkMonth(v===25?12:9); }} />
          <span className="text-xs text-slate-500 font-semibold">보기</span>
          <Seg opts={[['m','월별'],['c','누적']]} val={mkMode} on={setMkMode} />
          <span className="text-xs text-slate-500 font-semibold">{mode==='m'?'대상월':'기준월'}</span>
          <select value={mkMonth} onChange={(e)=>setMkMonth(+e.target.value)}
            className="px-2 py-1 text-xs border border-slate-300 rounded outline-none font-semibold">
            {Array.from({length:maxM},(_,i)=>i+1).map(m=><option key={m} value={m}>{m}월{mode==='c'?'까지':''}</option>)}
          </select>

              <div className={`text-xl font-bold ${k.c||'text-slate-900'}`}>{k.v}</div>
              <div className="text-[10px] text-slate-500 mt-1">{k.sb}</div>

                <th className={th} style={{width:'80px'}}>비용/매출</th><th className={th} style={{width:'90px'}}>25년 비용률</th>

              <tbody>
                {['nb','bj'].map(e=>{
                  const eb=cumT(e,0), ea=cumT(e,2), es=cumS(e,2);

                  for(let m=f;m<=t;m++){ ebSame+=(T(e,m,0)||0); esb+=(S(e,m,0)||0); }

                  const s25=Object.values(D[e].s25||{}).reduce((s,v)=>s+(v[2]||0),0);

        <div className="flex-1 overflow-y-auto p-2">

          <nav className="space-y-0.5">
            {/* 중국법인 (최상위 전체) */}
            <button onClick={() => { if (selectedHQ === AGG_HQ) setOrgOpen(v => !v); else { setSelectedHQ(AGG_HQ); setOrgOpen(true); } }}
              className={`w-full flex items-center gap-2 px-3 py-2 text-sm rounded text-left ${selectedHQ === AGG_HQ ? 'bg-blue-600 text-white' : 'text-slate-200 hover:bg-slate-800'}`}>
              <div className="flex-shrink-0"><Icon name="building" className="w-4 h-4" /></div>
              <span className="truncate font-semibold">중국법인</span>
            </button>
            {orgOpen && (<>
            <button onClick={() => setSelectedHQ('닝보·북경')}
              style={selectedHQ === '닝보·북경' ? {backgroundColor:'#426ecd'} : undefined}
              className={`w-full flex items-center gap-1 px-2 py-1.5 ml-1 text-xs rounded text-left ${selectedHQ === '닝보·북경' ? 'text-white font-semibold' : 'text-slate-300 hover:bg-slate-800'}`}>
              <Icon name="chevronRight" className="w-3.5 h-3.5 flex-shrink-0 opacity-70" />
              <span className="truncate font-semibold">닝보·북경 (공통)</span>
            </button>
            {/* 법인 → 본부 */}
            {ORG_TREE.map(group => {
              const expanded = (expandedCorps[group.corp] === true);
              return (
                <div key={group.corp} className="ml-1">
                  <div className={`w-full flex items-center gap-1 px-2 py-1.5 text-xs rounded ${selectedHQ === group.corp ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>
                    <button onClick={(e) => { e.stopPropagation(); setExpandedCorps(prev => ({ ...prev, [group.corp]: !expanded })); }}
                      className="flex-shrink-0 opacity-70 hover:opacity-100">

  /* ===== 메뉴 7: 하부고객 확대현황 (6번 카드형 구조 + subCustomer 데이터) ===== */
  const renderSubCustomer = (hqArg) => {
    // 중국법인(전체)이면 각 본부 블록을 세로로 쌓아서 표시 (각 블록은 자기 본부로 편집·저장)

          {ORG_TREE.map(group => (

                    {renderSubCustomerOne(h)}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }
    return renderSubCustomerOne(hqArg);
  };

  const renderSubCustomerOne = (hq) => {
    const { year: curYearSC } = parseWeekValue(filterWeek);
    const displayMonthSC = filterMonth || 5;
    const yearMonthSC = `${curYearSC}-${displayMonthSC}`;
    const monthLabelSC = `${displayMonthSC}월`;
    const is5월SC = displayMonthSC === 5;

    // 빈 템플릿 (구조 유지하되 수치 0)
    const emptySubCustomer = (subCustomer[hq] || []).map(d => ({
      ...d,
      baseCustomers: 0, target: 0, crmUsed: 0, crmNew: 0, prevDiff: 0,
      psiCount: 0, newCustomer: 0, visitGoal: 0, visitActual: 0,
      crmRate: 0, newRate: 0,
      target5Cust: 0, target5NewBiz: 0, actual5NewBiz: 0,
    }));

    // 월별 데이터 조회
    const rows = (subCustomerMonth[hq] && subCustomerMonth[hq][yearMonthSC])
      ? subCustomerMonth[hq][yearMonthSC]
      : (is5월SC ? (subCustomer[hq] || []) : emptySubCustomer);

    // 셀 업데이트 (월별 분리 자동)
    const updateSCCell = (idx, field, value) => {
      const numVal = parseFloat(value) || 0;
      setSubCustomerMonth(prev => {
        const cur = (prev[hq] && prev[hq][yearMonthSC])
          ? JSON.parse(JSON.stringify(prev[hq][yearMonthSC]))
          : JSON.parse(JSON.stringify(rows));
        cur[idx] = { ...cur[idx], [field]: numVal };
        return { ...prev, [hq]: { ...(prev[hq] || {}), [yearMonthSC]: cur } };
      });
      logChange(`하부고객 ${rows[idx].region} - ${monthLabelSC}`, `${field}: ${numVal}`);
    };

    // 각 행의 자동 계산값 (6번과 동일 패턴)
    const rowsWithCalc = rows.map(r => {
      // crmUsed = 26년 누계 실적 (수동), target = 26년 목표 (수동)
      const rate26Cum = (r.target || 0) > 0 ? Math.round((r.crmUsed || 0) / r.target * 100) : 0;
      // crmNew = 5월 신규 고객 실적, target5Cust = 5월 고객 목표
      const rate5Cust = (r.target5Cust || 0) > 0 ? Math.round((r.crmNew || 0) / r.target5Cust * 100) : 0;
      // newCustomer = 5월 신규업무 실적, target5NewBiz = 5월 신규업무 목표
      const rate5NewBiz = (r.target5NewBiz || 0) > 0 ? Math.round((r.actual5NewBiz || r.newCustomer || 0) / r.target5NewBiz * 100) : 0;
      // visitActual = 5월 방문 실적, visitGoal = 5월 방문 목표
      const rate5Visit = (r.visitGoal || 0) > 0 ? Math.round((r.visitActual || 0) / r.visitGoal * 100) : 0;
      return { ...r, rate26Cum, rate5Cust, rate5NewBiz, rate5Visit };
    });

    // 합계
    const tot = {
      baseCustomers: rowsWithCalc.reduce((s, r) => s + (r.baseCustomers || 0), 0),
      target: rowsWithCalc.reduce((s, r) => s + (r.target || 0), 0),
      crmUsed: rowsWithCalc.reduce((s, r) => s + (r.crmUsed || 0), 0),
      target5Cust: rowsWithCalc.reduce((s, r) => s + (r.target5Cust || 0), 0),
      crmNew: rowsWithCalc.reduce((s, r) => s + (r.crmNew || 0), 0),
      target5NewBiz: rowsWithCalc.reduce((s, r) => s + (r.target5NewBiz || 0), 0),
      actual5NewBiz: rowsWithCalc.reduce((s, r) => s + (r.actual5NewBiz || r.newCustomer || 0), 0),
      visitGoal: rowsWithCalc.reduce((s, r) => s + (r.visitGoal || 0), 0),
      visitActual: rowsWithCalc.reduce((s, r) => s + (r.visitActual || 0), 0),
    };
    tot.rate26Cum = tot.target > 0 ? Math.round(tot.crmUsed / tot.target * 100) : 0;
    tot.rate5Cust = tot.target5Cust > 0 ? Math.round(tot.crmNew / tot.target5Cust * 100) : 0;
    tot.rate5NewBiz = tot.target5NewBiz > 0 ? Math.round(tot.actual5NewBiz / tot.target5NewBiz * 100) : 0;
    tot.rate5Visit = tot.visitGoal > 0 ? Math.round(tot.visitActual / tot.visitGoal * 100) : 0;

    const rateColor = (v) => v >= 70 ? 'text-emerald-600' : v >= 40 ? 'text-blue-600' : v > 0 ? 'text-amber-600' : 'text-rose-600';
    const barColor = (v) => v >= 70 ? 'bg-emerald-500' : v >= 40 ? 'bg-blue-500' : v > 0 ? 'bg-amber-500' : 'bg-rose-400';

    // 메인 지역 = CRM 고객수(baseCustomers) 가장 큰 지역
    const mainRegion = rowsWithCalc.reduce((acc, r) => (r.baseCustomers || 0) > (acc?.baseCustomers || 0) ? r : acc, null);

    return (
      <div className="space-y-4">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="flex items-baseline gap-3 flex-wrap">
            <h2 className="text-2xl font-bold text-slate-900">하부고객 확대현황</h2>
          </div>
          <span className="text-xs text-slate-500 flex items-center gap-1">
            <Icon name="refresh" className="w-3 h-3" /> 데이터 기준일: {new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}
          </span>
        </div>

        <div className="flex items-center justify-end flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <button onClick={() => {
              const prevMonth = displayMonthSC - 1;
              if (prevMonth < 1) { alert('이전월이 없습니다 (1월에서는 사용 불가)'); return; }
              const prevYearMonth = `${curYearSC}-${prevMonth}`;
              const prevData = (subCustomerMonth[hq] && subCustomerMonth[hq][prevYearMonth])
                ? subCustomerMonth[hq][prevYearMonth]
                : (prevMonth === 5 ? subCustomer[hq] : null);
              if (!prevData) { alert(`${prevMonth}월에 데이터가 없습니다.`); return; }
              if (!confirm(`${prevMonth}월의 하부고객 데이터를 ${monthLabelSC}에 복사하시겠습니까?\n현재 ${monthLabelSC}의 데이터는 덮어씌워집니다.`)) return;
              setSubCustomerMonth(prev => ({
                ...prev,
                [hq]: { ...(prev[hq] || {}), [yearMonthSC]: JSON.parse(JSON.stringify(prevData)) }
              }));
              logChange(`7번 하부고객`, `${prevMonth}월 → ${monthLabelSC} 복사`);
              alert(`${prevMonth}월 데이터 → ${monthLabelSC}로 복사 완료!`);
            }}
              className="px-2 py-1.5 text-sm border border-purple-300 bg-purple-50 text-purple-700 rounded-md hover:bg-purple-100 font-semibold flex items-center gap-1.5">
              <Icon name="copy" className="w-3 h-3" /> 이전월 복사
            </button>
            <label className="px-2 py-1.5 text-sm border border-slate-300 rounded-md hover:bg-slate-50 cursor-pointer flex items-center gap-1.5">
              <Icon name="upload" className="w-3 h-3" /> 엑셀 업로드
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={(event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                  try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const xrows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                    const norm = (s) => String(s).replace(/[\s\n\r()（）]/g, '');
                    const pick = (row, cands) => {
                      const keys = Object.keys(row);
                      for (const c of cands) { const k = keys.find(k => norm(k).indexOf(norm(c)) === 0 || norm(c).indexOf(norm(k)) === 0); if (k !== undefined) return row[k]; }
                      return '';
                    };
                    const num = (v) => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
                    // 지역명으로 매칭 (없으면 새 행 추가 = 누적)
                    const base = JSON.parse(JSON.stringify(rows));
                    const byRegion = {}; base.forEach((r, i) => { byRegion[String(r.region).trim()] = i; });
                    let updated = 0, added = 0;
                    xrows.forEach(xr => {
                      const region = String(pick(xr, ['지역', 'region', '省份', '城市', '本部'])).trim();
                      if (!region) return;
                      const patch = {
                        baseCustomers: num(pick(xr, ['CRM고객수', 'CRM고객', 'baseCustomers', '고객수'])),
                        target: num(pick(xr, ['26년목표', '누계목표', 'target', '목표'])),
                        crmUsed: num(pick(xr, ['26년누계실적', '누계실적', 'crmUsed', '실적'])),
                        crmNew: num(pick(xr, ['신규고객실적', 'crmNew', '신규실적'])),
                        target5Cust: num(pick(xr, ['고객목표', 'target5Cust'])),
                        actual5NewBiz: num(pick(xr, ['신규개발실적', '신규개발', 'actual5NewBiz'])),
                        target5NewBiz: num(pick(xr, ['신규개발목표', 'target5NewBiz'])),
                        visitActual: num(pick(xr, ['방문실적', 'visitActual'])),
                        visitGoal: num(pick(xr, ['방문목표', 'visitGoal'])),
                      };
                      if (byRegion[region] !== undefined) {
                        base[byRegion[region]] = { ...base[byRegion[region]], ...patch };
                        updated++;
                      } else {
                        base.push({ region: region, ...patch });
                        added++;
                      }
                    });
                    if (updated === 0 && added === 0) { alert('인식 가능한 지역 행이 없습니다. 헤더(지역 등)를 확인해 주세요.'); return; }
                    if (!confirm(`${monthLabelSC} 하부고객 데이터에 반영합니다.\n\n· 지역 값 업데이트: ${updated}건\n· 새 지역 추가(누적): ${added}건\n\n계속하시겠습니까?`)) { event.target.value = ''; return; }
                    setSubCustomerMonth(prev => ({ ...prev, [hq]: { ...(prev[hq] || {}), [yearMonthSC]: base } }));
                    logChange(`하부고객 엑셀`, `${hq} ${monthLabelSC} (갱신 ${updated}/추가 ${added})`);
                    alert(`✅ 반영 완료!\n· 업데이트 ${updated}건\n· 추가 ${added}건`);
                  } catch (err) { alert('엑셀 읽기 실패: ' + err.message); }
                };
                reader.readAsArrayBuffer(file);
                event.target.value = '';
              }} />
            </label>
            <button onClick={() => {
              if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
              const data = (rows.length ? rows : [{}]).map(r => ({
                '지역': r.region || '', 'CRM고객수': r.baseCustomers || 0, '26년목표': r.target || 0,
                '26년누계실적': r.crmUsed || 0, '신규고객실적': r.crmNew || 0, '고객목표': r.target5Cust || 0,
                '신규개발실적': (r.actual5NewBiz ?? r.newCustomer ?? 0), '신규개발목표': r.target5NewBiz || 0,
                '방문실적': r.visitActual || 0, '방문목표': r.visitGoal || 0,
              }));
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), `${monthLabelSC}_하부고객`);
              XLSX.writeFile(wb, `하부고객_${hq}_${yearMonthSC}.xlsx`);
            }}
              className="px-2 py-1.5 text-sm border border-slate-300 rounded-md hover:bg-slate-50 flex items-center gap-1.5">
              <Icon name="download" className="w-3 h-3" /> 엑셀 다운로드
            </button>
            <button onClick={() => { logChange('하부고객', `저장 (${monthLabelSC})`); alert('저장되었습니다!'); }}
              className="px-2.5 py-1 text-[11px] bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold">
              저장
            </button>
          </div>
        </div>

        <MenuNoteBanner noteKey={`sc_note|${hq}|${yearMonthSC}`} monthLabel={monthLabelSC} hq={hq} year={curYearSC} weeklyEntries={weeklyEntries} setWeeklyEntries={setWeeklyEntries} />

        {/* === 메인 카드 === */}

          {rowsWithCalc.length === 0 ? (

                        )}
                      </div>
                    </div>

                    <div className="mb-1.5">
                      <div className="text-[10px] text-amber-700 font-semibold mb-0.5">26년 누계 진척률</div>
                      <div className="flex items-center justify-between gap-2 mb-0.5">
                        <div className="flex items-center gap-1 whitespace-nowrap" style={{ fontSize: '20px', lineHeight: '1.1' }}>
                          <span className="font-bold text-amber-700 cursor-pointer hover:bg-amber-50 px-1 rounded transition" title="누계 실적 (클릭 수정)">
                            <EditableCell value={row.crmUsed || 0} type="number" onSave={(v) => updateSCCell(idx, 'crmUsed', v)} />
                          </span>
                          <span className="text-slate-400">/</span>
                          <span className="text-slate-600 cursor-pointer hover:bg-amber-50 px-1 rounded transition" title="26년 목표 (클릭 수정)">
                            <EditableCell value={row.target || 0} type="number" onSave={(v) => updateSCCell(idx, 'target', v)} />

                        <span className={`font-bold whitespace-nowrap ${rateColor(row.rate26Cum)}`} style={{ fontSize: '18px', lineHeight: '1.1' }}>{row.rate26Cum}%</span>
                      </div>
                      <div className="h-1 bg-slate-100 rounded-full overflow-hidden">

                    <div className="mb-1.5">
                      <div className="text-[10px] text-blue-700 font-semibold mb-0.5">{monthLabelSC} 고객 달성률</div>
                      <div className="flex items-center justify-between gap-2 mb-0.5">

                      </div>
                      <div className="h-1 bg-slate-100 rounded-full overflow-hidden">

                    <div className="border-t border-slate-200 pt-1.5 mt-1">

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <div className="text-[10px] text-emerald-700">신규업무</div>
                          <div className="flex items-center justify-between gap-1 whitespace-nowrap">

                                <EditableCell value={row.target5NewBiz || 0} type="number" onSave={(v) => updateSCCell(idx, 'target5NewBiz', v)} />
                              </span>

                          </div>
                        </div>
                        <div>
                          <div className="text-[10px] text-pink-700">방문횟수</div>
                          <div className="flex items-center justify-between gap-1 whitespace-nowrap">
                            <div className="flex items-center gap-1" style={{ fontSize: '20px', lineHeight: '1.1' }}>
                              <span className="font-bold text-pink-700 cursor-pointer hover:bg-pink-50 px-1 rounded transition" title="실적 (클릭 수정)">
                                <EditableCell value={row.visitActual || 0} type="number" onSave={(v) => updateSCCell(idx, 'visitActual', v)} />
                              </span>
                              <span className="text-slate-400">/</span>
                              <span className="text-slate-600 cursor-pointer hover:bg-pink-50 px-1 rounded transition" title="목표 (클릭 수정)">
                                <EditableCell value={row.visitGoal || 0} type="number" onSave={(v) => updateSCCell(idx, 'visitGoal', v)} />
                              </span>
                            </div>
                            <span className={`font-bold ${rateColor(row.rate5Visit)}`} style={{ fontSize: '15px', lineHeight: '1.1' }}>{row.rate5Visit}%</span>
                          </div>
