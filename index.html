<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>MGG 교육마케팅활동</title>
<script>
  // === 다중 CDN 폴백 시스템 ===
  // CDN이 차단되거나 느릴 경우 자동으로 다음 CDN을 시도합니다.
  // 한국/중국 회사 네트워크 환경에서도 안정 동작하도록 4개 CDN 사용.
  (function() {
    var libs = [
      {
        name: 'tailwind',
        check: function() { return typeof tailwind !== 'undefined' || document.querySelector('[data-tailwind-loaded]') !== null; },
        urls: [
          'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4',
          'https://cdn.tailwindcss.com',
          'https://unpkg.com/@tailwindcss/browser@4',
          'https://fastly.jsdelivr.net/npm/@tailwindcss/browser@4',
        ],
        optional: true  // Tailwind는 선택사항 (실패해도 앱은 동작)
      },
      {
        name: 'react',
        check: function() { return typeof React !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
          'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
          'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
          'https://fastly.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
        ]
      },
      {
        name: 'react-dom',
        check: function() { return typeof ReactDOM !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
          'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
          'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
          'https://fastly.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
        ]
      },
      {
        name: 'prop-types',
        check: function() { return typeof PropTypes !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js',
          'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
          'https://unpkg.com/prop-types@15.8.1/prop-types.min.js',
          'https://fastly.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
        ]
      },
      {
        name: 'recharts',
        check: function() { return typeof Recharts !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/Recharts/2.12.7/Recharts.js',
          'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js',
          'https://unpkg.com/recharts@2.12.7/umd/Recharts.js',
          'https://fastly.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js',
        ]
      },
      {
        name: 'lz-string',
        check: function() { return typeof LZString !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js',
          'https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js',
          'https://unpkg.com/lz-string@1.5.0/libs/lz-string.min.js',
        ],
        optional: true
      },
      {
        name: 'babel',
        check: function() { return typeof Babel !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js',
          'https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',
          'https://unpkg.com/@babel/standalone/babel.min.js',
          'https://fastly.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',
        ]
      },
      {
        name: 'xlsx',
        check: function() { return typeof XLSX !== 'undefined'; },
        urls: [
          'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
          'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
          'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
          'https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
        ],
        optional: true
      }
    ];

    // 로딩 상태 표시
    var loadingStatus = document.createElement('div');
    loadingStatus.style.cssText = 'margin-top: 12px; color: #64748b; font-size: 11px; font-family: system-ui;';
    loadingStatus.id = 'cdn-status';

    function setStatus(msg) {
      try { loadingStatus.textContent = msg; } catch (e) {}
    }

    // 순차적으로 라이브러리 로드 (의존성 순서 중요)
    function loadLib(libIndex) {
      if (libIndex >= libs.length) {
        // 모든 라이브러리 로드 완료
        setStatus('모든 라이브러리 로드 완료, 앱 초기화 중...');
        if (typeof window.__startApp === 'function') window.__startApp();
        return;
      }

      var lib = libs[libIndex];

      // 이미 로드된 경우 다음으로
      try {
        if (lib.check()) {
          loadLib(libIndex + 1);
          return;
        }
      } catch (e) {}

      tryUrl(lib, 0, libIndex);
    }

    function tryUrl(lib, urlIndex, libIndex) {
      if (urlIndex >= lib.urls.length) {
        // 모든 CDN 실패
        if (lib.optional) {
          // 선택사항이면 무시하고 다음 라이브러리로
          console.warn('[CDN] ' + lib.name + ' 로드 실패 (선택사항, 무시)');
          loadLib(libIndex + 1);
        } else {
          showError(lib.name);
        }
        return;
      }

      var url = lib.urls[urlIndex];
      var script = document.createElement('script');
      script.crossOrigin = 'anonymous';
      script.src = url;
      setStatus('라이브러리 로드 중: ' + lib.name + ' (' + (urlIndex + 1) + '/' + lib.urls.length + ')');

      script.onload = function() {
        // Tailwind 같은 옵셔널 라이브러리는 onload 발생만으로 성공 처리
        if (lib.optional) {
          try { if (lib.check && !lib.check()) {} } catch(e) {}
          loadLib(libIndex + 1);
          return;
        }
        // 실제로 로드되었는지 확인
        setTimeout(function() {
          try {
            if (lib.check()) {
              loadLib(libIndex + 1);
            } else {
              // 스크립트는 로드됐지만 객체가 안 나타남 - 다음 CDN 시도
              tryUrl(lib, urlIndex + 1, libIndex);
            }
          } catch (e) {
            tryUrl(lib, urlIndex + 1, libIndex);
          }
        }, 50);
      };

      script.onerror = function() {
        // 이 CDN 실패, 다음 CDN 시도
        tryUrl(lib, urlIndex + 1, libIndex);
      };

      document.head.appendChild(script);
    }

    function showError(failedLib) {
      var box = document.getElementById('error-box');
      if (!box) return;
      box.style.display = 'block';
      box.innerHTML =
        '<strong>⚠️ 라이브러리 로드 실패</strong><br>' +
        '<b>' + failedLib + '</b><br><br>' +
        '<b>해결 방법:</b><br>' +
        '• 인터넷 연결을 확인해 주세요<br>' +
        '• 회사 네트워크에서 외부 CDN이 모두 차단된 환경입니다<br>' +
        '• 다른 네트워크(개인 Wi-Fi / 핫스팟)로 시도해 보세요<br>' +
        '• 또는 IT 부서에 다음 도메인 허용 요청:<br>' +
        '&nbsp;&nbsp;cdnjs.cloudflare.com, cdn.jsdelivr.net, unpkg.com';
      var loading = document.getElementById('loading');
      if (loading) loading.classList.add('hide');
    }

    // DOMContentLoaded 후 로드 시작
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        var loading = document.getElementById('loading');
        if (loading) loading.appendChild(loadingStatus);
        loadLib(0);
      });
    } else {
      var loading = document.getElementById('loading');
      if (loading) loading.appendChild(loadingStatus);
      loadLib(0);
    }
  })();
</script>
<style>
  /* === 중국어 한자(CJK Unified Ideographs)만 Microsoft YaHei로 렌더링 === */
  /* 한국어/영어/숫자는 영향 안 받음 */
  @font-face {
    font-family: 'CJKChineseFont';
    src: local('Microsoft YaHei'), local('微软雅黑'), local('PingFang SC'), local('Source Han Sans CN'), local('WenQuanYi Micro Hei'), local('SimHei'), local('SimSun');
    /* CJK Unified Ideographs (한자 기본) + Extension A + Compatibility Ideographs */
    unicode-range: U+4E00-9FFF, U+3400-4DBF, U+F900-FAFF, U+20000-2A6DF, U+2A700-2B73F, U+2B740-2B81F, U+2B820-2CEAF, U+2F800-2FA1F;
    font-display: swap;
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "맑은 고딕", "CJKChineseFont", "Microsoft YaHei", "微软雅黑", "PingFang SC", "Source Han Sans CN", "WenQuanYi Micro Hei", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ===== 컬럼 너비 조절 기능 ===== */
  /* 모든 표 헤더(th)에 우측 드래그 핸들 추가 */
  table th {
    position: relative;
    overflow: visible !important;
  }
  table th .col-resizer {
    position: absolute;
    top: 0;
    right: -3px;
    width: 6px;
    height: 100%;
    cursor: col-resize;
    user-select: none;
    z-index: 10;
    background: transparent;
    transition: background 0.15s;
  }
  table th .col-resizer:hover,
  table th .col-resizer.dragging {
    background: #3b82f6;
  }
  table th .col-resizer::before {
    content: '';
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 50%;
    background: #cbd5e1;
  }
  table th:hover .col-resizer::before {
    background: #94a3b8;
  }
  body.col-resizing {
    cursor: col-resize !important;
    user-select: none !important;
  }
  body.col-resizing * {
    cursor: col-resize !important;
    user-select: none !important;
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f1f5f9; font-family: system-ui, "맑은 고딕", sans-serif; z-index: 9999; }
  #loading.hide { display: none; }
  .spinner { width: 48px; height: 48px; border: 4px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-box { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px 24px; border-radius: 8px; max-width: 600px; font-family: system-ui, sans-serif; z-index: 10000; }

  /* === 표 첫 컬럼 sticky (가로 스크롤 시 고정) — data-sticky-first="off" 표는 제외 === */
  table[data-table-id]:not([data-sticky-first="off"]) thead th:first-child,
  table[data-table-id]:not([data-sticky-first="off"]) tfoot td:first-child {
    position: sticky;
    left: 0;
    z-index: 5;
    background-color: #f1f5f9; /* slate-100 (헤더 회색과 동일) */
  }
  table[data-table-id]:not([data-sticky-first="off"]) tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 4;
    background-color: #ffffff; /* 흰색 */
  }
  /* 호버 시 첫 컬럼도 살짝 강조 */
  table[data-table-id]:not([data-sticky-first="off"]) tbody tr:hover td:first-child {
    background-color: #f8fafc; /* slate-50 */
  }
  /* 첫 컬럼 오른쪽 그림자 (구분감) */
  table[data-table-id]:not([data-sticky-first="off"]) thead th:first-child,
  table[data-table-id]:not([data-sticky-first="off"]) tbody td:first-child,
  table[data-table-id]:not([data-sticky-first="off"]) tfoot td:first-child {
    box-shadow: 1px 0 0 0 #e2e8f0;
  }

  /* === 정렬 가능 헤더 === */
  table[data-table-id] thead th.sortable-header {
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s;
    position: relative;
  }
  table[data-table-id] thead th.sortable-header:hover {
    background-color: #e2e8f0; /* slate-200 */
  }
  table[data-table-id] thead th.sortable-header .sort-icon {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
    color: #94a3b8; /* slate-400 */
    vertical-align: middle;
  }
  table[data-table-id] thead th.sortable-header.sort-asc .sort-icon::after {
    content: '';
    color: #2563eb; /* blue-600 */
  }
  table[data-table-id] thead th.sortable-header.sort-desc .sort-icon::after {
    content: '';
    color: #2563eb; /* blue-600 */
  }
  table[data-table-id] thead th.sortable-header:not(.sort-asc):not(.sort-desc) .sort-icon::after {
    content: '';
    opacity: 0.5;
  }
</style>
</head>
<body class="bg-slate-100">
<div id="loading">
  <div class="spinner"></div>
  <div style="margin-top: 16px; color: #475569; font-size: 14px;">MGG 교육마케팅활동 로딩 중...</div>
  <div style="margin-top: 8px; color: #94a3b8; font-size: 12px;">처음 실행 시 라이브러리 다운로드로 몇 초 걸릴 수 있습니다.</div>
</div>
<div id="error-box"></div>
<div id="root"></div>

<script>
  // 전역 에러 캐치
  window.addEventListener('error', function(e) {
    if (e.message && e.message.indexOf('Script error') === -1) {
      var box = document.getElementById('error-box');
      if (!box) return;
      if (box.style.display !== 'block') {
        box.style.display = 'block';
        box.innerHTML = '<strong>⚠️ 오류 발생</strong><br>' + e.message;
      }
    }
  });

  // CDN 로드 완료 후 호출되는 앱 시작 함수
  // (다중 CDN 폴백 시스템이 모든 라이브러리 로드 후 호출)
  window.__startApp = function() {
    var loading = document.getElementById('loading');
    var babelScript = document.getElementById('app-babel-script');
    if (!babelScript) {
      if (loading) loading.classList.add('hide');
      return;
    }
    try {
      // Babel로 JSX 코드를 변환하여 실행
      var transformed = Babel.transform(babelScript.textContent, {
        presets: ['react']
      }).code;
      var runner = document.createElement('script');
      runner.textContent = transformed;
      document.body.appendChild(runner);
      // 로딩 화면 숨김
      setTimeout(function() {
        if (loading) loading.classList.add('hide');
        // 컬럼 리사이저 시작
        startColumnResizer();
      }, 100);
    } catch (e) {
      var box = document.getElementById('error-box');
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '<strong>⚠️ 앱 시작 실패</strong><br>' + e.message;
      }
      if (loading) loading.classList.add('hide');
    }
  };

  // ===== 컬럼 리사이저 헬퍼 =====
  // 모든 <table>의 <th>에 드래그 핸들을 자동으로 추가합니다.
  // 사용자가 마우스로 끌어서 컬럼 너비를 조절할 수 있습니다.
  // 조절된 너비는 localStorage에 자동 저장되어 새로고침해도 유지됩니다.
  function startColumnResizer() {
    var STORAGE_KEY = 'mggedu_column_widths_v1';

    // 저장된 너비 불러오기
    function loadWidths() {
      try {
        var w = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        // PSI 연간표(psiAnnual_*)는 colgroup 고정 — 저장된 너비 무시
        Object.keys(w).forEach(function(k){ if (k.indexOf('psiAnnual_') === 0 || k.indexOf('sales_emp_progress') === 0 || k.indexOf('bd_entry_status') === 0 || k.indexOf('dso_progress') === 0 || k.indexOf('dso_entry_status') === 0 || k.indexOf('dso_sales_status') === 0) delete w[k]; });
        return w;
      }
      catch (e) { return {}; }
    }

    // 너비 저장
    function saveWidths(widths) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(widths)); }
      catch (e) {}
    }

    // 표 식별자 생성 (위치 기반)
    function getTableId(table) {
      // 표의 첫 번째 헤더 텍스트 + 페이지 내 위치로 식별
      var firstTh = table.querySelector('th');
      var firstHeader = firstTh ? firstTh.textContent.trim().slice(0, 20) : '';
      var allTables = Array.from(document.querySelectorAll('table'));
      var idx = allTables.indexOf(table);
      return 'table_' + idx + '_' + firstHeader.replace(/\s+/g, '_');
    }

    // 컬럼 식별자 (표 ID + 헤더 인덱스)
    function getColId(tableId, thIndex) {
      return tableId + '_col_' + thIndex;
    }

    // 단일 <th>에 리사이저 추가
    function attachResizer(th, thIndex, tableId, widths) {
      // 이미 추가됐으면 스킵
      if (th.querySelector('.col-resizer')) return;
      // colspan 있는 경우는 패스 (멀티헤더 1단)
      if (th.colSpan > 1) return;

      // 저장된 너비 복원
      var colKey = getColId(tableId, thIndex);
      if (widths[colKey]) {
        th.style.width = widths[colKey] + 'px';
        th.style.minWidth = widths[colKey] + 'px';
      }

      // 리사이즈 핸들 생성
      var handle = document.createElement('div');
      handle.className = 'col-resizer';
      th.appendChild(handle);

      // 드래그 이벤트
      var startX, startWidth;
      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        startX = e.clientX;
        startWidth = th.offsetWidth;
        handle.classList.add('dragging');
        document.body.classList.add('col-resizing');

        function onMove(ev) {
          var dx = ev.clientX - startX;
          var newWidth = Math.max(40, startWidth + dx);  // 최소 너비 40px
          th.style.width = newWidth + 'px';
          th.style.minWidth = newWidth + 'px';
        }

        function onUp() {
          handle.classList.remove('dragging');
          document.body.classList.remove('col-resizing');
          // 저장
          var w = loadWidths();
          w[colKey] = th.offsetWidth;
          saveWidths(w);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // 더블클릭 → 너비 리셋
      handle.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        th.style.width = '';
        th.style.minWidth = '';
        var w = loadWidths();
        delete w[colKey];
        saveWidths(w);
      });
    }

    // 모든 표 처리
    function processAllTables() {
      var widths = loadWidths();
      var tables = document.querySelectorAll('table');
      tables.forEach(function(table) {
        // React ResizableHeader를 쓰는 표는 제외 (자체 너비 저장 사용)
        if (table.getAttribute('data-table-id') === 'bd_customers') return;
        if (table.getAttribute('data-table-id') === 'dealer_psi_summary') return;
        // PSI 연간표(대리상별 계약실적현황)는 colgroup으로 고정 — 제외
        var _tid = table.getAttribute('data-table-id') || '';
        if (_tid.indexOf('psiAnnual_') === 0) return;
        if (_tid === 'sales_emp_progress') return;
        if (_tid === 'bd_entry_status') return;
        if (_tid === 'dso_progress') return;
        if (_tid === 'dso_entry_status') return;
        if (_tid === 'dso_sales_status') return;
        if (table.querySelector('thead .cursor-col-resize')) return;
        var tableId = getTableId(table);
        // 모든 헤더 행을 한 번에 처리 (rowSpan으로 1단에만 있는 셀도 포함)
        var allThs = table.querySelectorAll('thead th');
        if (allThs.length === 0) return;

        // 리사이저는 colspan이 없는 모든 th에 부착 (attachResizer 내부에서 colSpan>1은 자동 스킵)
        allThs.forEach(function(th, idx) {
          attachResizer(th, idx, tableId, widths);
        });
      });
    }

    // 초기 실행
    setTimeout(processAllTables, 500);

    // React가 표를 다시 렌더링할 때마다 재적용
    // MutationObserver로 표 변경 감지
    var observer = new MutationObserver(function(mutations) {
      var needsUpdate = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1 && (node.tagName === 'TABLE' || node.querySelector && node.querySelector('table'))) {
            needsUpdate = true;
          }
        });
      });
      if (needsUpdate) {
        clearTimeout(window.__resizerDebounce);
        window.__resizerDebounce = setTimeout(processAllTables, 200);
      }
    });

    var root = document.getElementById('root');
    if (root) {
      observer.observe(root, { childList: true, subtree: true });
    }

    // 메뉴 전환 시 재적용 (페이지 변경 감지)
    document.addEventListener('click', function() {
      setTimeout(processAllTables, 300);
    });

    // 전역 헬퍼: 모든 컬럼 너비 리셋
    window.__resetColumnWidths = function() {
      localStorage.removeItem(STORAGE_KEY);
      document.querySelectorAll('table th').forEach(function(th) {
        th.style.width = '';
        th.style.minWidth = '';
      });
      alert('모든 컬럼 너비가 기본값으로 초기화되었습니다.');
    };
  }
</script>

// === 주차 옵션 (2026년 1주차 ~ 2028년 52주차, 총 156주) ===
const WEEK_OPTIONS = (() => {
  const opts = [];
  // 52주 → 12개월로 단순 매핑
  // 1~4주: 1월 1~4주차 / 5~8주: 2월 1~4주차 / ... / 49~52주: 12월 1~4주차
  // (5번째 주차는 다음 달의 1주차로 자연스럽게 흘러가도록 일부 월은 5주차 포함)
  for (let year = 2026; year <= 2028; year++) {
    for (let week = 1; week <= 52; week++) {
      // 단순 매핑: week를 4.33으로 나눠서 월 결정 (1~12월)
      const month = Math.min(12, Math.ceil(week / 4.333));
      // 해당 월 안에서 몇 번째 주차인지
      const monthStartWeek = Math.ceil((month - 1) * 4.333) + 1;
      const weekInMonth = week - monthStartWeek + 1;
      opts.push({
        value: `${year}-${String(week).padStart(2, '0')}`,
        label: `${year}년 ${month}월 ${weekInMonth}주차`,
        year,
        week,
        month,
        weekInMonth,
      });
    }
  }
  return opts;
})();

// 주차 값에서 연도/주차 분리
function parseWeekValue(weekStr) {
  if (!weekStr || typeof weekStr !== 'string') return { year: 2026, week: 1 };
  const [y, w] = weekStr.split('-');
  return { year: parseInt(y) || 2026, week: parseInt(w) || 1 };
}

function EditableCell({ value, onSave, type = 'text', align = 'left', suffix = '', placeholder = '', className = '', multiline = false }) {
  const [editing, setEditing] = useState(false);
  const [temp, setTemp] = useState(value);
  useEffect(() => { setTemp(value); }, [value]);

  const handleSave = () => {
    let v = temp;
    if (type === 'number') { v = parseFloat(temp); if (isNaN(v)) v = 0; }
    onSave(v);
    setEditing(false);
  };

  const alignClass = align === 'right' ? 'text-right' : align === 'center' ? 'text-center' : 'text-left';

  if (editing) {
    if (multiline) {
      return <textarea value={temp} autoFocus placeholder={placeholder} rows={3}
        onChange={(e) => setTemp(e.target.value)} onBlur={handleSave}
        onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleSave(); if (e.key === 'Escape') { setTemp(value); setEditing(false); }}}
        className={`w-full px-1.5 py-1 border border-blue-400 rounded outline-none text-slate-900 resize-y ${alignClass}`} style={{ minHeight: '3.5em', whiteSpace: 'pre-wrap' }} />;
    }
    return <input type={type === 'number' ? 'number' : 'text'} step="0.1" value={temp} autoFocus placeholder={placeholder}
      onChange={(e) => setTemp(e.target.value)} onBlur={handleSave}
      onKeyDown={(e) => { if (e.key === 'Enter') handleSave(); if (e.key === 'Escape') { setTemp(value); setEditing(false); }}}
      className={`w-full px-1 py-0.5 border border-blue-400 rounded outline-none text-slate-900 ${alignClass}`} />;
  }

  const isEmpty = value === '' || value === null || value === undefined;
  if (multiline) {
    return (
      <div onClick={() => setEditing(true)}
        className={`cursor-pointer hover:bg-blue-50 px-2 py-1 rounded ${alignClass}`}
        style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }} title="클릭하여 수정">
        {isEmpty ? <span className="text-slate-400 italic">{placeholder || ''}</span> : value}{!isEmpty && suffix}
      </div>
    );
  }
  // className이 지정되면 커스텀 스타일 사용 (배너 등), 아니면 기본 스타일
  if (className) {
    return (
      <span onClick={() => setEditing(true)}
        className={`cursor-pointer hover:opacity-75 ${className}`} title="클릭하여 수정">
        {isEmpty ? <span className="opacity-60 italic">{placeholder || '입력'}</span> : (typeof value === 'number' ? (value % 1 === 0 ? formatNumber(value) : value.toFixed(1)) : value)}{!isEmpty && suffix}
      </span>
    );
  }
  return (
    <div onClick={() => setEditing(true)}
      className={`cursor-pointer hover:bg-blue-50 px-2 py-1 rounded ${alignClass}`} title="클릭하여 수정">
      {isEmpty ? <span className="text-slate-400 italic">{placeholder || ''}</span> : (typeof value === 'number' ? (value % 1 === 0 ? formatNumber(value) : value.toFixed(1)) : value)}{!isEmpty && suffix}
    </div>
  );
}

function NoteBoard({ noteKey, weeklyEntries, setWeeklyEntries, label }) {
  // 접기 상태 (메모별 저장)
  const collapseKey = 'mggedu_noteCollapse|' + noteKey;
  const [collapsed, setCollapsed] = React.useState(() => {
    try { const v = localStorage.getItem(collapseKey); if (v !== null) return v === '1'; } catch(e){}
    return true; // 기본 접힘
  });
  React.useEffect(()=>{ try{ localStorage.setItem(collapseKey, collapsed?'1':'0'); }catch(e){} }, [collapsed, collapseKey]);
  // 저장값: JSON 배열. 기존 단일 텍스트가 있으면 첫 항목으로 마이그레이션.
  const raw = weeklyEntries[noteKey];
  const items = React.useMemo(() => {
    if (raw === undefined || raw === null || raw === '') return [];
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    } catch(e) {}
    // 옛 단일 텍스트 → 항목 1개로 변환
    return [{ id: 'mig'+Date.now(), type:'note', text: String(raw), done:false, pinned:false, color:'', bold:false }];
  }, [raw]);

  const save = (next) => setWeeklyEntries(prev => ({ ...prev, [noteKey]: JSON.stringify(next) }));
  const add = (type) => {
    const it = { id: 'n'+Date.now()+Math.random().toString(36).slice(2,5), type, text:'', done:false, pinned:false, color:'', bold:false };
    save([...items, it]);
  };
  const upd = (id, patch) => save(items.map(it => it.id===id ? {...it, ...patch} : it));
  const del = (id) => save(items.filter(it => it.id!==id));

  // 핀 우선 정렬
  const sorted = [...items].sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));

  const colors = [
    { key:'', label:'기본', cls:'bg-white' },
    { key:'amber', label:'주황', cls:'bg-amber-50 border-amber-200' },
    { key:'rose', label:'빨강', cls:'bg-rose-50 border-rose-200' },
    { key:'blue', label:'파랑', cls:'bg-blue-50 border-blue-200' },
    { key:'green', label:'초록', cls:'bg-emerald-50 border-emerald-200' },
  ];
  const colorCls = (c) => (colors.find(x=>x.key===c)||colors[0]).cls;

  const AutoText = ({ value, onSave, bold, placeholder }) => {
    const [t, setT] = React.useState(value);
    React.useEffect(()=>setT(value),[value]);
    const ref = React.useRef(null);
    const fit = (el) => { if(el){ el.style.height='auto'; el.style.height=Math.max(28, el.scrollHeight)+'px'; } };
    return <textarea ref={(el)=>{ref.current=el; fit(el);}} value={t}
      onChange={e=>{ setT(e.target.value); fit(e.target); }}
      onBlur={()=>onSave(t)}
      placeholder={placeholder}
      className={"w-full bg-transparent outline-none resize-none text-sm leading-relaxed "+(bold?'font-bold':'')}
      style={{minHeight:'28px', overflow:'hidden'}} />;
  };

  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <button onClick={()=>setCollapsed(!collapsed)} className="flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-slate-900">
          <span className="inline-block w-3 text-center">{collapsed ? '▶' : '▼'}</span>
          메모 / 할 일
          {items.length>0 && <span className="text-slate-400 font-normal">({items.length})</span>}
        </button>
        {!collapsed && (<>
          <button onClick={()=>add('note')} className="px-2 py-1 text-xs border border-slate-300 rounded hover:bg-slate-50">+ 메모</button>
          <button onClick={()=>add('todo')} className="px-2 py-1 text-xs border border-slate-300 rounded hover:bg-slate-50">+ 할 일</button>
        </>)}
        {items.filter(i=>i.type==='todo'&&!i.done).length>0 && <span className="text-[11px] text-amber-600">미완료 할 일 {items.filter(i=>i.type==='todo'&&!i.done).length}개</span>}
      </div>
      {!collapsed && (sorted.length===0 ? (
        <div className="text-sm text-slate-400 py-4 text-center border border-dashed border-slate-200 rounded-md">메모나 할 일을 추가하세요.</div>
      ) : (
        <div className="flex flex-col gap-2">
          {sorted.map(it => (
            <div key={it.id} className={"border rounded-md p-2 flex items-start gap-2 "+colorCls(it.color)+(it.pinned?' border-l-4':'')}>
              {it.type==='todo' && (
                <input type="checkbox" checked={!!it.done} onChange={()=>upd(it.id,{done:!it.done})} className="mt-1.5 cursor-pointer flex-shrink-0" />
              )}
              <div className="flex-1 min-w-0">
                <div className={it.done?'line-through text-slate-400':''}>
                  <AutoText value={it.text} bold={it.bold} placeholder={it.type==='todo'?'할 일 입력...':'메모 입력...'} onSave={(v)=>upd(it.id,{text:v})} />
                </div>
              </div>
              <div className="flex items-center gap-0.5 flex-shrink-0">
                <button onClick={()=>upd(it.id,{pinned:!it.pinned})} title="고정" className={"text-xs px-1 rounded hover:bg-slate-100 "+(it.pinned?'text-amber-500':'text-slate-300')}>📌</button>
                <button onClick={()=>upd(it.id,{bold:!it.bold})} title="굵게" className={"text-xs px-1 rounded hover:bg-slate-100 font-bold "+(it.bold?'text-slate-900':'text-slate-300')}>B</button>
                <select value={it.color} onChange={e=>upd(it.id,{color:e.target.value})} title="색상" className="text-xs border-0 bg-transparent cursor-pointer text-slate-400 hover:text-slate-700 w-7">
                  {colors.map(c=><option key={c.key} value={c.key}>{c.key===''?'○':'●'}</option>)}
                </select>
                <button onClick={()=>del(it.id)} title="삭제" className="text-xs px-1 rounded hover:bg-slate-100 text-slate-300 hover:text-rose-600">✕</button>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

const loadLS = (key, fallback) => {

  catch (e) { return fallback; }
};
const saveLS = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} };


/* ===== 중국법인(전체) 집계/분배 헬퍼 ===== */
// 배열형 데이터(패키지·세미나)용.
// 중국법인 화면에서는 모든 본부의 행을 _hq 태그와 함께 모아 보여주고,
// 추가/수정/삭제는 각 행의 _hq(본부) 로 라우팅한다. → 각 본부 화면에 그대로 반영.
function aggRows(dataByHQ, hq) {
  if (hq === AGG_HQ) {
    const out = [];
    REAL_HQS.forEach(h => (dataByHQ[h] || []).forEach(r => out.push({ ...r, _hq: h })));
    return out;
  }
  return (dataByHQ[hq] || []).map(r => ({ ...r, _hq: hq }));
}
// 특정 행(id)이 실제로 속한 본부 찾기 (중국법인 편집 시)
function ownerHQ(dataByHQ, hq, id) {
  if (hq !== AGG_HQ) return hq;
  for (const h of REAL_HQS) {
    if ((dataByHQ[h] || []).some(r => r.id === id)) return h;
  }
  return REAL_HQS[0];
}

// 집계 행을 법인(닝보/북경) → 본부 순으로 정렬하고, 각 행에 법인 태그(_corp)를 붙인다.
// 반환: 정렬된 행 배열. 소계 삽입은 렌더에서 _corp 경계로 판단.
function sortByCorpHQ(rows) {
  const corpIdx = (c) => { const i = CORP_LIST.indexOf(c); return i < 0 ? 99 : i; };
  const hqIdx = (h) => { const i = REAL_HQS.indexOf(h); return i < 0 ? 99 : i; };
  return rows.map(r => ({ ...r, _corp: HQ_CORP[r._hq] || '기타' }))
    .sort((a, b) => {
      const ca = corpIdx(a._corp), cb = corpIdx(b._corp);
      if (ca !== cb) return ca - cb;
      const ha = hqIdx(a._hq), hb = hqIdx(b._hq);
      return ha - hb;
    });
}

  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [expandedCorps, setExpandedCorps] = useState({});

  const [subCustomer, setSubCustomer] = useState(() => loadLS(LS.subCustomer, initialSubCustomer));

  const [packagePerson, setPackagePerson] = useState(() => loadLS(LS.packagePerson, initialPackagePerson));
  const [seminar, setSeminar] = useState(() => loadLS(LS.seminar, initialSeminar));
  const [seminarPlan, setSeminarPlan] = useState(() => loadLS(LS.seminarPlan, initialSeminarPlan));
  const [seminarActual, setSeminarActual] = useState(() => loadLS(LS.seminarActual, initialSeminarActual));
  const [weeklyEntries, setWeeklyEntries] = useState(() => loadLS(LS.weeklyEntries, {}));
  const [changeLog, setChangeLog] = useState(() => loadLS(LS.changeLog, []));

  const [pkgSortKey, setPkgSortKey] = useState(null);
  const [pkgSortOrder, setPkgSortOrder] = useState('asc');
  const [smSortKey, setSmSortKey] = useState(null);
  const [smSortOrder, setSmSortOrder] = useState('asc');
  const [scSortKey, setScSortKey] = useState(null);
  const [scSortOrder, setScSortOrder] = useState('asc');
  const [spSortKey, setSpSortKey] = useState(null);
  const [spSortOrder, setSpSortOrder] = useState('asc');
  const [spTab, setSpTab] = useState('plan');
  const [spExpanded, setSpExpanded] = useState({});

  useEffect(() => { try { localStorage.setItem(LS.hq, selectedHQ); } catch(e){} }, [selectedHQ]);
  useEffect(() => { try { localStorage.setItem(LS.menu, selectedMenu); } catch(e){} }, [selectedMenu]);
  useEffect(() => { try { localStorage.setItem(LS.week, filterWeek); } catch(e){} }, [filterWeek]);
  useEffect(() => { try { localStorage.setItem(LS.month, String(filterMonth)); } catch(e){} }, [filterMonth]);
  useEffect(() => { saveLS(LS.subCustomer, subCustomer); }, [subCustomer]);
  useEffect(() => { saveLS(LS.subCustomerMonth, subCustomerMonth); }, [subCustomerMonth]);
  useEffect(() => { saveLS(LS.packagePerson, packagePerson); }, [packagePerson]);
  useEffect(() => { saveLS(LS.seminar, seminar); }, [seminar]);
  useEffect(() => { saveLS(LS.seminarPlan, seminarPlan); }, [seminarPlan]);
  useEffect(() => { saveLS(LS.seminarActual, seminarActual); }, [seminarActual]);
  useEffect(() => { saveLS(LS.weeklyEntries, weeklyEntries); }, [weeklyEntries]);
  useEffect(() => { saveLS(LS.changeLog, changeLog); }, [changeLog]);

  const logChange = (page, detail) => {
    setChangeLog(prev => [{ time: new Date().toLocaleString('ko-KR'), page, detail }, ...prev].slice(0, 100));
  };

  /* ===== 클라우드 페이로드 ===== */
  const buildPayload = () => {
    let weeklyLatest = weeklyEntries;
    try {
      const raw = localStorage.getItem(LS.weeklyEntries);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Object.keys(parsed).length >= Object.keys(weeklyEntries || {}).length) weeklyLatest = parsed;
      }
    } catch(e){}
    const _photos = {}, weeklySlim = {};
    try {
      Object.keys(weeklyLatest || {}).forEach(k => {
        const v = weeklyLatest[k];
        if (typeof v === 'string' && v.indexOf('data:image') !== -1) _photos[k] = v;
        else weeklySlim[k] = v;
      });
    } catch(e){ Object.assign(weeklySlim, weeklyLatest || {}); }
    return { _app: 'MGG_EDU_MKT_v1', subCustomer, subCustomerMonth, packagePerson, seminar, seminarPlan, seminarActual, weeklyEntries: weeklySlim, _photos, changeLog };
  };

  const handleCloudSave = async () => {
    if (!GOOGLE_SCRIPT_URL) { alert(NO_URL_MSG); return; }
    const payload = buildPayload();
    const rawJson = JSON.stringify(payload);
    const rawMB = rawJson.length / 1048576;
    let bodyStr, sizeMB, compressed = false;
    if (typeof LZString !== 'undefined') {
      bodyStr = JSON.stringify({ action: 'save', payload: { _z: true, _c: LZString.compressToBase64(rawJson) } });
      sizeMB = bodyStr.length / 1048576; compressed = true;
    } else {
      bodyStr = JSON.stringify({ action: 'save', payload: payload });
      sizeMB = bodyStr.length / 1048576;
    }
    const sizeInfo = compressed ? `원본 ${rawMB.toFixed(2)}MB → 압축 ${sizeMB.toFixed(2)}MB` : `${sizeMB.toFixed(2)}MB (압축 미적용)`;
    if (sizeMB > 8 && !confirm(`⚠️ 저장 데이터가 ${sizeMB.toFixed(1)}MB로 큽니다.\n일부가 잘릴 수 있습니다. 그래도 저장할까요?`)) return;
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: bodyStr });
      let ok = false, errMsg = '';
      try { const j = await res.json(); ok = j.ok !== false; errMsg = j.error || ''; } catch (e) { ok = res.ok; }
      if (ok) {
        localStorage.setItem('mggedu_last_cloud_save', new Date().toISOString());
        alert('✅ 클라우드 저장 완료!\n저장 시각: ' + new Date().toLocaleString('ko-KR') + '\n' + sizeInfo);
      } else {
        alert('❌ 저장 실패' + (errMsg ? ': ' + errMsg : ''));
      }
    } catch (e) {
      try {
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: bodyStr });
        localStorage.setItem('mggedu_last_cloud_save', new Date().toISOString());
        alert('✅ 전송 완료 (응답 확인 불가 모드)\n' + sizeInfo + '\n\n⚠️ [클라우드 불러오기]로 정상 저장 여부를 확인해 주세요.');
      } catch (e2) { alert('❌ 저장 실패: ' + e2.message); }
    }
  };

  const handleCloudLoad = async () => {
    if (!GOOGLE_SCRIPT_URL) { alert(NO_URL_MSG); return; }
    if (!confirm('⚠️ 클라우드에서 불러오면 현재 데이터가 덮어쓰여집니다.\n\n계속하시겠습니까?')) return;
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const data = await res.json();
      if (!data.ok) { alert('❌ 불러오기 실패: ' + (data.error || 'Unknown error')); return; }
      let d = data.data || {};
      if (d && d._z && d._c) {
        if (typeof LZString === 'undefined') { alert('⚠️ 압축 라이브러리가 없어 데이터를 펼칠 수 없습니다.'); return; }
        try { const json = LZString.decompressFromBase64(d._c); if (json) d = JSON.parse(json); }
        catch(e){ alert('⚠️ 압축 해제 실패.'); return; }
      }
      if (d._app && d._app !== 'MGG_EDU_MKT_v1') {
        if (!confirm('⚠️ 이 클라우드 시트는 다른 앱(' + d._app + ')의 데이터로 보입니다.\n그래도 불러올까요?')) return;
      }
      if (d._photos && typeof d._photos === 'object') d.weeklyEntries = Object.assign({}, d.weeklyEntries || {}, d._photos);
      if (d.subCustomer) { setSubCustomer(d.subCustomer); saveLS(LS.subCustomer, d.subCustomer); }
      if (d.subCustomerMonth) { setSubCustomerMonth(d.subCustomerMonth); saveLS(LS.subCustomerMonth, d.subCustomerMonth); }
      if (d.packagePerson) { setPackagePerson(d.packagePerson); saveLS(LS.packagePerson, d.packagePerson); }
      if (d.seminar) { setSeminar(d.seminar); saveLS(LS.seminar, d.seminar); }
      if (d.seminarPlan) { setSeminarPlan(d.seminarPlan); saveLS(LS.seminarPlan, d.seminarPlan); }
      if (d.seminarActual) { setSeminarActual(d.seminarActual); saveLS(LS.seminarActual, d.seminarActual); }
      if (d.weeklyEntries) { setWeeklyEntries(d.weeklyEntries); saveLS(LS.weeklyEntries, d.weeklyEntries); }
      if (d.changeLog) setChangeLog(d.changeLog);
      alert('✅ 클라우드 불러오기 완료!\n마지막 저장: ' + (data.lastSaved || '알 수 없음') + '\n\n화면 적용을 위해 새로고침합니다.');
      setTimeout(() => window.location.reload(), 400);
    } catch (e) { alert('❌ 불러오기 실패: ' + e.message); }
  };

  /* ===== 백업 / 복원 (.xlsx) ===== */
  const handleFullBackup = () => {
    if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패. 새로고침 후 다시 시도해 주세요.'); return; }
    try {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([
        { 항목: '백업 일시', 값: new Date().toLocaleString('ko-KR') },
        { 항목: '앱', 값: 'MGG 교육마케팅활동' },
        { 항목: '버전', 값: 'v1' },
      ]), '백업정보');

      const scRows = [];
      Object.entries(subCustomer || {}).forEach(([hq, rows]) => (rows || []).forEach(r => scRows.push({ 본부: hq, ...r })));
      if (scRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(scRows), '하부고객');

      const pkgRows = [];
      Object.entries(packagePerson || {}).forEach(([hq, rows]) => (rows || []).forEach(r => pkgRows.push({ 본부: hq, ...r })));
      if (pkgRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pkgRows), '패키지활동');

      const smRows = [];
      Object.entries(seminar || {}).forEach(([hq, rows]) => (rows || []).forEach(r => {
        const cac = (r.newCustomers || 0) > 0 ? +((r.cost || 0) / r.newCustomers).toFixed(2) : '';
        const rpc = (r.newCustomers || 0) > 0 ? +((r.newRevenue || 0) / r.newCustomers).toFixed(2) : '';
        const roi = (r.cost || 0) > 0 ? +((r.newRevenue || 0) / r.cost).toFixed(2) : '';
        smRows.push({ 본부: hq, 연월: r.yearMonth || '', 日期: r.date || '', 大区: r.bigRegion || '', 省份: r.province || '',
          城市: r.city || '', 类别: r.category || '', 主题: r.topic || '', 讲师: r.lecturer || '', 经销商: r.dealer || '',
          总人数实际: r.totalPeople || 0, '新客户开发实际(家)': r.newCustomers || 0, '新增销售额(万)': r.newRevenue || 0,
          '培训班费用(万)': r.cost || 0, CAC: cac, '신규고객당매출': rpc, 'LTV/CAC': roi });
      }));

      if ((seminarPlan||[]).length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(seminarPlan.map(spCols)), '세미나계획');
      if ((seminarActual||[]).length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(seminarActual.map(spCols)), '세미나실행');

      const noteRows = Object.entries(weeklyEntries || {}).map(([k, v]) => ({ 원본키: k, 원본값: typeof v === 'string' ? v : JSON.stringify(v) }));
      if (noteRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(noteRows), '메모');

      if (changeLog && changeLog.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(changeLog), '변경이력');

      const json = JSON.stringify(buildPayload());
      const chunks = [];
      for (let i = 0; i < json.length; i += 30000) chunks.push({ 순번: chunks.length + 1, 데이터: json.slice(i, i + 30000) });

      XLSX.writeFile(wb, `MGG교육마케팅활동_백업_${new Date().toISOString().slice(0,10)}.xlsx`);
      logChange('시스템', '전체 백업');

  const handleFullRestore = (event) => {

        const d = JSON.parse(json);

        if (d.subCustomer) { setSubCustomer(d.subCustomer); saveLS(LS.subCustomer, d.subCustomer); }
        if (d.subCustomerMonth) { setSubCustomerMonth(d.subCustomerMonth); saveLS(LS.subCustomerMonth, d.subCustomerMonth); }
        if (d.packagePerson) { setPackagePerson(d.packagePerson); saveLS(LS.packagePerson, d.packagePerson); }

        if (d.seminarActual) { setSeminarActual(d.seminarActual); saveLS(LS.seminarActual, d.seminarActual); }
        if (d.weeklyEntries) { setWeeklyEntries(d.weeklyEntries); saveLS(LS.weeklyEntries, d.weeklyEntries); }
        if (d.changeLog) setChangeLog(d.changeLog);
        alert('✅ 복원 완료! 새로고침합니다.');
        setTimeout(() => window.location.reload(), 400);
      } catch (err) { alert('복원 실패: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
    event.target.value = '';
  };

  const renderSubCustomerOne = (hq) => {
    const { year: curYearSC } = parseWeekValue(filterWeek);
    const displayMonthSC = filterMonth || 5;
    const yearMonthSC = `${curYearSC}-${displayMonthSC}`;
    const monthLabelSC = `${displayMonthSC}월`;
    const is5월SC = displayMonthSC === 5;

    // 빈 템플릿 (구조 유지하되 수치 0)
    const emptySubCustomer = (subCustomer[hq] || []).map(d => ({
      ...d,
      baseCustomers: 0, target: 0, crmUsed: 0, crmNew: 0, prevDiff: 0,
      psiCount: 0, newCustomer: 0, visitGoal: 0, visitActual: 0,
      crmRate: 0, newRate: 0,
      target5Cust: 0, target5NewBiz: 0, actual5NewBiz: 0,

    // 월별 데이터 조회
    const rows = (subCustomerMonth[hq] && subCustomerMonth[hq][yearMonthSC])

      : (is5월SC ? (subCustomer[hq] || []) : emptySubCustomer);

    // 셀 업데이트 (월별 분리 자동)

      setSubCustomerMonth(prev => {

        return { ...prev, [hq]: { ...(prev[hq] || {}), [yearMonthSC]: cur } };

      logChange(`하부고객 ${rows[idx].region} - ${monthLabelSC}`, `${field}: ${numVal}`);
    };

    // 각 행의 자동 계산값 (6번과 동일 패턴)
    const rowsWithCalc = rows.map(r => {
      // crmUsed = 26년 누계 실적 (수동), target = 26년 목표 (수동)
      const rate26Cum = (r.target || 0) > 0 ? Math.round((r.crmUsed || 0) / r.target * 100) : 0;
      // crmNew = 5월 신규 고객 실적, target5Cust = 5월 고객 목표
      const rate5Cust = (r.target5Cust || 0) > 0 ? Math.round((r.crmNew || 0) / r.target5Cust * 100) : 0;
      // newCustomer = 5월 신규업무 실적, target5NewBiz = 5월 신규업무 목표

      // visitActual = 5월 방문 실적, visitGoal = 5월 방문 목표
      const rate5Visit = (r.visitGoal || 0) > 0 ? Math.round((r.visitActual || 0) / r.visitGoal * 100) : 0;
      return { ...r, rate26Cum, rate5Cust, rate5NewBiz, rate5Visit };
    });

    // 합계
    const tot = {
      baseCustomers: rowsWithCalc.reduce((s, r) => s + (r.baseCustomers || 0), 0),
      target: rowsWithCalc.reduce((s, r) => s + (r.target || 0), 0),
      crmUsed: rowsWithCalc.reduce((s, r) => s + (r.crmUsed || 0), 0),

    tot.rate5NewBiz = tot.target5NewBiz > 0 ? Math.round(tot.actual5NewBiz / tot.target5NewBiz * 100) : 0;
    tot.rate5Visit = tot.visitGoal > 0 ? Math.round(tot.visitActual / tot.visitGoal * 100) : 0;

    const rateColor = (v) => v >= 70 ? 'text-emerald-600' : v >= 40 ? 'text-blue-600' : v > 0 ? 'text-amber-600' : 'text-rose-600';
    const barColor = (v) => v >= 70 ? 'bg-emerald-500' : v >= 40 ? 'bg-blue-500' : v > 0 ? 'bg-amber-500' : 'bg-rose-400';

    // 메인 지역 = CRM 고객수(baseCustomers) 가장 큰 지역
    const mainRegion = rowsWithCalc.reduce((acc, r) => (r.baseCustomers || 0) > (acc?.baseCustomers || 0) ? r : acc, null);

    return (
      <div className="space-y-4">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h2 className="text-2xl font-bold text-slate-900">하부고객 확대현황</h2>
          <div className="flex items-center gap-2">

              const prevYearMonth = `${curYearSC}-${prevMonth}`;
              const prevData = (subCustomerMonth[hq] && subCustomerMonth[hq][prevYearMonth])
                ? subCustomerMonth[hq][prevYearMonth]
                : (prevMonth === 5 ? subCustomer[hq] : null);
              if (!prevData) { alert(`${prevMonth}월에 데이터가 없습니다.`); return; }
              if (!confirm(`${prevMonth}월의 하부고객 데이터를 ${monthLabelSC}에 복사하시겠습니까?\n현재 ${monthLabelSC}의 데이터는 덮어씌워집니다.`)) return;
              setSubCustomerMonth(prev => ({
                ...prev,
                [hq]: { ...(prev[hq] || {}), [yearMonthSC]: JSON.parse(JSON.stringify(prevData)) }
              }));
              logChange(`7번 하부고객`, `${prevMonth}월 → ${monthLabelSC} 복사`);
              alert(`${prevMonth}월 데이터 → ${monthLabelSC}로 복사 완료!`);
            }}
              className="px-3 py-1.5 text-xs border border-slate-300 rounded hover:bg-slate-50 flex items-center gap-1">
              <Icon name="copy" className="w-3.5 h-3.5" /> 이전월 복사
            </button>
            <label className="px-3 py-1.5 text-xs border border-slate-300 rounded hover:bg-slate-50 flex items-center gap-1 cursor-pointer">
              <Icon name="upload" className="w-3.5 h-3.5" /> 엑셀 업로드
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={(event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                  try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const xrows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                    const norm = (s) => String(s).replace(/[\s\n\r()（）]/g, '');
                    const pick = (row, cands) => {
                      const keys = Object.keys(row);
                      for (const c of cands) { const k = keys.find(k => norm(k).indexOf(norm(c)) === 0 || norm(c).indexOf(norm(k)) === 0); if (k !== undefined) return row[k]; }
                      return '';
                    };
                    const num = (v) => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
                    // 지역명으로 매칭 (없으면 새 행 추가 = 누적)
                    const base = JSON.parse(JSON.stringify(rows));
                    const byRegion = {}; base.forEach((r, i) => { byRegion[String(r.region).trim()] = i; });
                    let updated = 0, added = 0;
                    xrows.forEach(xr => {
                      const region = String(pick(xr, ['지역', 'region', '省份', '城市', '本部'])).trim();
                      if (!region) return;
                      const patch = {
                        baseCustomers: num(pick(xr, ['CRM고객수', 'CRM고객', 'baseCustomers', '고객수'])),
                        target: num(pick(xr, ['26년목표', '누계목표', 'target', '목표'])),
                        crmUsed: num(pick(xr, ['26년누계실적', '누계실적', 'crmUsed', '실적'])),
                        crmNew: num(pick(xr, ['신규고객실적', 'crmNew', '신규실적'])),
                        target5Cust: num(pick(xr, ['고객목표', 'target5Cust'])),
                        actual5NewBiz: num(pick(xr, ['신규개발실적', '신규개발', 'actual5NewBiz'])),
                        target5NewBiz: num(pick(xr, ['신규개발목표', 'target5NewBiz'])),
                        visitActual: num(pick(xr, ['방문실적', 'visitActual'])),
                        visitGoal: num(pick(xr, ['방문목표', 'visitGoal'])),
                      };
                      if (byRegion[region] !== undefined) {
                        base[byRegion[region]] = { ...base[byRegion[region]], ...patch };
                        updated++;
                      } else {
                        base.push({ region: region, ...patch });
                        added++;
                      }
                    });
                    if (updated === 0 && added === 0) { alert('인식 가능한 지역 행이 없습니다. 헤더(지역 등)를 확인해 주세요.'); return; }
                    if (!confirm(`${monthLabelSC} 하부고객 데이터에 반영합니다.\n\n· 지역 값 업데이트: ${updated}건\n· 새 지역 추가(누적): ${added}건\n\n계속하시겠습니까?`)) { event.target.value = ''; return; }
                    setSubCustomerMonth(prev => ({ ...prev, [hq]: { ...(prev[hq] || {}), [yearMonthSC]: base } }));
                    logChange(`하부고객 엑셀`, `${hq} ${monthLabelSC} (갱신 ${updated}/추가 ${added})`);
                    alert(`✅ 반영 완료!\n· 업데이트 ${updated}건\n· 추가 ${added}건`);
                  } catch (err) { alert('엑셀 읽기 실패: ' + err.message); }
                };
                reader.readAsArrayBuffer(file);
                event.target.value = '';
              }} />
            </label>
            <button onClick={() => {
              if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
              const data = (rows.length ? rows : [{}]).map(r => ({
                '지역': r.region || '', 'CRM고객수': r.baseCustomers || 0, '26년목표': r.target || 0,
                '26년누계실적': r.crmUsed || 0, '신규고객실적': r.crmNew || 0, '고객목표': r.target5Cust || 0,
                '신규개발실적': (r.actual5NewBiz ?? r.newCustomer ?? 0), '신규개발목표': r.target5NewBiz || 0,
                '방문실적': r.visitActual || 0, '방문목표': r.visitGoal || 0,

        <MenuNoteBanner noteKey={`sc_note|${hq}|${yearMonthSC}`} monthLabel={monthLabelSC} hq={hq} year={curYearSC} weeklyEntries={weeklyEntries} setWeeklyEntries={setWeeklyEntries} />

        {/* === 메인 카드 === */}
        <div className="bg-white border border-slate-200 rounded-md p-4">

          {rowsWithCalc.length === 0 ? (

                    <div className="mb-1.5">
                      <div className="text-[10px] text-amber-700 font-semibold mb-0.5">26년 누계 진척률</div>
                      <div className="flex items-center justify-between gap-2 mb-0.5">
                        <div className="flex items-center gap-1 whitespace-nowrap" style={{ fontSize: '20px', lineHeight: '1.1' }}>

                                <EditableCell value={row.visitActual || 0} type="number" onSave={(v) => updateSCCell(idx, 'visitActual', v)} />
                              </span>

                              <span className="text-slate-600 cursor-pointer hover:bg-pink-50 px-1 rounded transition" title="목표 (클릭 수정)">
                                <EditableCell value={row.visitGoal || 0} type="number" onSave={(v) => updateSCCell(idx, 'visitGoal', v)} />
                              </span>
                            </div>
                            <span className={`font-bold ${rateColor(row.rate5Visit)}`} style={{ fontSize: '15px', lineHeight: '1.1' }}>{row.rate5Visit}%</span>

                );
              })}

          )}

          <div className="mt-3 text-[11px] text-slate-500 flex items-center gap-2 flex-wrap">
            <span>밑줄 친 숫자 클릭하여 직접 입력 · 모든 % 자동 계산 · 월별 분리 자동</span>
          </div>
