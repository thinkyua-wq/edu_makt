                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div className="mt-3 text-[11px] text-slate-500 flex items-center gap-2 flex-wrap">
            <span>밑줄 친 숫자 클릭하여 직접 입력 · 모든 % 자동 계산 · 월별 분리 자동</span>
          </div>
        </div>
      </div>
    );
  };

  /* ===== 메뉴 9: 패키지 판매인원 (월별 분리 + 깔끔한 단일 표) ===== */
  const renderPackage = (hq) => {
    const { year: curYear } = parseWeekValue(filterWeek);
    const displayMonth = filterMonth || 5;
    const isYearPkg = (filterMonth === 0);
    const monthLabel = isYearPkg ? '연간(전체)' : `${displayMonth}월`;
    const yearMonth = `${curYear}-${displayMonth}`;

    // === 월별 분리 헬퍼 ===
    // 키 구조: pkg|hq|rowId|field|year-month  (값은 객체 안의 한 필드)
    // 단순화: weeklyEntries에 직접 row 객체 통째 저장
    // pkg_row|hq|year-month|rowId  → 한 row의 모든 필드를 JSON으로 (간단)
    // 더 단순하게: packagePerson state에 hq별로 보관, 행마다 yearMonth 필드 추가

    // === 현재 hq + 월 데이터 ===
    // 마이그레이션: yearMonth 필드 없는 옛 데이터는 '2026-5'로 간주 (한 번만)
    const isAgg = hq === AGG_HQ;
    const allRows = aggRows(packagePerson, hq).map(r => ({
      ...r,
      yearMonth: r.yearMonth || '2026-5'
    }));
    let monthRows = allRows.filter(r => isYearPkg ? String(r.yearMonth||'').indexOf(`${curYear}-`) === 0 : r.yearMonth === yearMonth);
    // === 정렬 적용 ===
    if (pkgSortKey) {
      monthRows = [...monthRows].sort((a, b) => {
        const av = (a[pkgSortKey] || '').toString();
        const bv = (b[pkgSortKey] || '').toString();
        const cmp = av.localeCompare(bv, 'ko');
        return pkgSortOrder === 'asc' ? cmp : -cmp;
      });
    }

    // === 정렬 헬퍼 ===
    const handleSort = (key) => {
      if (pkgSortKey !== key) {
        setPkgSortKey(key);
        setPkgSortOrder('asc');
      } else if (pkgSortOrder === 'asc') {
        setPkgSortOrder('desc');
      } else {
        setPkgSortKey(null);
        setPkgSortOrder('asc');
      }
    };
    const sortIcon = (key) => {
      if (pkgSortKey !== key) return '↕';
      return pkgSortOrder === 'asc' ? '▲' : '▼';
    };

    // === KPI 합계 (당월) ===
    const total = monthRows.reduce((acc, r) => ({
      preparedKits: acc.preparedKits + (r.preparedKits || 0),
      soldKits: acc.soldKits + (r.soldKits || 0),
      revenueKrmb: acc.revenueKrmb + (r.revenueKrmb || 0),
      targetPeople: acc.targetPeople + (r.targetPeople || 0),
      progressedPeople: acc.progressedPeople + (r.progressedPeople || 0),
    }), { preparedKits: 0, soldKits: 0, revenueKrmb: 0, targetPeople: 0, progressedPeople: 0 });
    total.qtyRate = total.preparedKits > 0 ? +(total.soldKits / total.preparedKits * 100).toFixed(1) : 0;
    total.personRate = total.targetPeople > 0 ? +(total.progressedPeople / total.targetPeople * 100).toFixed(1) : 0;

    // === 신규 등록 ===
    const addNewRow = () => {
      const destHQ = isAgg ? REAL_HQS[0] : hq;
      const newRow = {
        id: 'pkg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        yearMonth: yearMonth,
        region: (REGIONS[destHQ] || ['지역'])[0],
        eventMonth: `${displayMonth}월`,
        dealerName: '',
        eventName: '',
        salesSystem: 'AR',
        preparedKits: 0,
        salesGoal: 0,
        soldKits: 0,
        revenueKrmb: 0,
        updatedAt: new Date().toISOString().slice(0, 10),
      };
      setPackagePerson(prev => ({
        ...prev,
        [destHQ]: [...(prev[destHQ] || []), newRow]
      }));
      logChange(`패키지 - 신규`, `${monthLabel} / ${destHQ}`);
    };

    // === 행 삭제 ===
    const deleteRow = (id) => {
      if (!confirm('이 행을 삭제하시겠습니까?')) return;
      setPackagePerson(prev => {
        const owner = ownerHQ(prev, hq, id);
        return { ...prev, [owner]: (prev[owner] || []).filter(r => r.id !== id) };
      });
      logChange(`패키지 - 삭제`, id);
    };

    // === 직접 수정 ===
    const updateRowField = (id, field, value) => {
      const numericFields = ['preparedKits', 'soldKits', 'revenueKrmb', 'salesGoal', 'targetPeople', 'progressedPeople'];
      const finalValue = numericFields.includes(field) ? (parseFloat(value) || 0) : value;
      setPackagePerson(prev => {
        const owner = ownerHQ(prev, hq, id);
        return {
          ...prev,
          [owner]: (prev[owner] || []).map(r =>
            r.id === id ? { ...r, yearMonth: r.yearMonth || yearMonth, [field]: finalValue, updatedAt: new Date().toISOString().slice(0, 10) } : r
          )
        };
      });
    };
    const moveRowToHQ = (id, newHQ) => {
      setPackagePerson(prev => {
        const owner = ownerHQ(prev, hq, id);
        if (owner === newHQ) return prev;
        const row = (prev[owner] || []).find(r => r.id === id);
        if (!row) return prev;
        const clean = { ...row }; delete clean._hq;
        // 지역이 새 본부에 없으면 새 본부 첫 지역으로
        if ((REGIONS[newHQ] || []).indexOf(clean.region) < 0) clean.region = (REGIONS[newHQ] || ['지역'])[0];
        return {
          ...prev,
          [owner]: (prev[owner] || []).filter(r => r.id !== id),
          [newHQ]: [...(prev[newHQ] || []), clean],
        };
      });
      logChange('패키지 - 본부이동', `${id} → ${newHQ}`);
    };

    // 행별 자동 계산
    const calcRow = (row) => {
      const qtyRate = row.preparedKits > 0 ? +(row.soldKits / row.preparedKits * 100).toFixed(1) : 0;
      const personRate = row.targetPeople > 0 ? +(row.progressedPeople / row.targetPeople * 100).toFixed(1) : 0;
      return { qtyRate, personRate };
    };

    // === 이전월 데이터 복사 ===
    const handleCopyPrevMonthPkg = () => {
      if (isAgg) { alert('이전월 복사는 각 본부 화면에서 사용해 주세요.\n(중국법인은 전체 집계·분배 화면입니다)'); return; }
      if (isYearPkg) { alert('연간(전체) 보기에서는 이전월 복사를 사용할 수 없습니다. 특정 월을 선택해 주세요.'); return; }
      const prevMonth = displayMonth - 1;
      if (prevMonth < 1) { alert('이전월이 없습니다 (1월에서는 사용 불가)'); return; }
      const prevYearMonth = `${curYear}-${prevMonth}`;

      // 이전월의 패키지 데이터
      const allHqRows = packagePerson[hq] || [];
      const prevMonthRows = allHqRows.filter(r => r.yearMonth === prevYearMonth);

      if (prevMonthRows.length === 0) {
        alert(`${prevMonth}월에 패키지 데이터가 없습니다.`);
        return;
      }
      // 현재 월에 데이터 있으면 확인
      const currentCount = monthRows.length;
      let msg = `${prevMonth}월의 ${prevMonthRows.length}개 행을 ${monthLabel}로 복사하시겠습니까?`;
      if (currentCount > 0) {
        msg += `\n\n주의: ${monthLabel}에 현재 ${currentCount}개 행이 있습니다.\n복사하면 기존 데이터에 추가됩니다.`;
      }
      if (!confirm(msg)) return;

      // 새 ID 생성하여 추가
      const newRows = prevMonthRows.map(r => ({
        ...r,
        id: 'pkg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        yearMonth: yearMonth,
        updatedAt: new Date().toISOString().slice(0, 10),
      }));

      setPackagePerson(prev => ({
        ...prev,
        [hq]: [...(prev[hq] || []), ...newRows]
      }));
      logChange(`9번 패키지`, `${prevMonth}월 → ${monthLabel} 복사 (${newRows.length}개 행)`);
      alert(`${prevMonth}월 데이터 → ${monthLabel}로 복사 완료! (${newRows.length}개 행)`);
    };

    // === 엑셀 다운로드 (당월 데이터만) ===
    const handleExcelDownload = () => {
      if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
      const wb = XLSX.utils.book_new();
      const UNIT_PRICE = { AO: 431, AR: 567, BD: 650 };
      // 전체 판매매출 합계 (판매비중 계산용)
      const totalRev = monthRows.reduce((s, r) => {
        const sysQ = r.preparedKits || 0;
        const up = r.salesGoal && r.salesGoal > 0 ? r.salesGoal : (UNIT_PRICE[r.salesSystem] || 0);
        const soldQ = r.soldKits || 0;
        return s + (sysQ * up * soldQ);
      }, 0);
      const dataForExcel = monthRows.map((r, idx) => {
        const sysQ = r.preparedKits || 0;
        const up = r.salesGoal && r.salesGoal > 0 ? r.salesGoal : (UNIT_PRICE[r.salesSystem] || 0);
        const soldQ = r.soldKits || 0;
        const rev = sysQ * up * soldQ;
        const share = totalRev > 0 ? +(rev / totalRev * 100).toFixed(1) : 0;
        return {
          'No': idx + 1,
          '본부': r._hq || hq,
          '지역': r.region || '',
          '행사월': r.eventMonth || '',
          '대리상명': r.dealerName || '',
          '행사명칭': r.eventName || '',
          '판매시스템': r.salesSystem || 'AR',
          '시스템수량': sysQ,
          '판매단가(위안)': up,
          '판매수량': soldQ,
          '판매매출(위안)': rev,
          '판매비중(%)': share,
        };
      });
      const ws = XLSX.utils.json_to_sheet(dataForExcel);
      XLSX.utils.book_append_sheet(wb, ws, `${monthLabel}_패키지판매`);
      XLSX.writeFile(wb, `${hq}_패키지판매_${yearMonth}.xlsx`);
      logChange(`8번 패키지`, `엑셀 다운로드 (${monthLabel})`);
    };

    // === 엑셀 업로드 ===
    const handleExcelUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
          if (rows.length === 0) { alert('엑셀에 데이터가 없습니다.'); return; }
          const hqAliasP = { '中国法人':'중국법인','华南':'화남본부','华西':'화서본부','华东':'화동본부','浙江':'절강본부','华中':'화중본부','北京':'북경법인','北京法人':'북경법인' };
          const resolveHQP = (r) => {
            if (!isAgg) return hq;
            const raw = String(r['본부'] || r['本部'] || '').trim();
            if (!raw) return REAL_HQS[0];
            if (REAL_HQS.indexOf(raw) >= 0) return raw;
            return hqAliasP[raw] || REAL_HQS[0];
          };
          const distMsg = isAgg ? '\n(본부 열 기준으로 각 본부에 분배)' : '';
          if (!confirm(`${rows.length}건의 데이터를 ${monthLabel} 데이터에 추가하시겠습니까?${distMsg}\n(기존 데이터는 유지됩니다)`)) return;
          const byHQ = {};
          rows.forEach(r => {
            const dest = resolveHQP(r);
            (byHQ[dest] = byHQ[dest] || []).push({
              id: 'pkg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '_' + Math.floor(Math.random()*1e4),
              yearMonth: yearMonth,
              region: r['지역'] || (REGIONS[dest] || ['지역'])[0],
              eventMonth: r['행사월'] || `${displayMonth}월`,
              dealerName: r['대리상명'] || '',
              eventName: r['행사명칭'] || '',
              salesSystem: r['판매시스템'] || r['구분'] || 'AR',
              preparedKits: parseFloat(r['시스템수량'] || 0) || 0,
              salesGoal: parseFloat(r['판매단가(위안)'] || r['판매목표'] || 0) || 0,
              soldKits: parseFloat(r['판매수량'] || 0) || 0,
              revenueKrmb: parseFloat(r['매출(K RMB)'] || r['매출'] || 0) || 0,
              updatedAt: new Date().toISOString().slice(0, 10),
            });
          });
          let totalAdd = 0;
          setPackagePerson(prev => {
            const next = { ...prev };
            Object.keys(byHQ).forEach(h => { next[h] = [...(prev[h] || []), ...byHQ[h]]; totalAdd += byHQ[h].length; });
            return next;
          });
          logChange(`패키지`, `엑셀 업로드 ${rows.length}건 (${monthLabel})${isAgg ? ' [분배]' : ''}`);
          alert(`${rows.length}건 추가 완료!`);
        } catch (err) {
          alert('엑셀 읽기 실패: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    };

    return (
      <div className="space-y-4">
        {/* 페이지 타이틀 */}
        <div className="flex items-baseline justify-between mb-2">
          <div className="flex items-baseline gap-3">
            <h1 className="text-2xl font-bold text-slate-900">{hq}</h1>
            <h2 className="text-2xl font-bold text-slate-900">패키지 활동보고</h2>
            {isAgg && <span className="px-2 py-0.5 text-xs font-bold bg-amber-100 text-amber-700 rounded">전체 집계·분배</span>}
          </div>
          <span className="text-xs text-slate-500 flex items-center gap-1">
            <Icon name="refresh" className="w-3 h-3" /> 데이터 기준일: {new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}
          </span>
        </div>

        {/* 액션 버튼 */}
        <div className="flex items-center justify-end gap-2">
          <button onClick={handleCopyPrevMonthPkg}
            className="flex items-center gap-1 px-1.5 py-1 text-[11px] border border-purple-300 bg-purple-50 text-purple-700 rounded hover:bg-purple-100 font-semibold">
            <Icon name="copy" className="w-3 h-3" /> 이전월 복사
          </button>
          <label className="flex items-center gap-1 px-1.5 py-1 text-[11px] border border-slate-300 rounded hover:bg-slate-50 cursor-pointer">
            <Icon name="upload" className="w-3 h-3" /> 엑셀 업로드
            <input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelUpload} className="hidden" />
          </label>
          <button onClick={handleExcelDownload}
            className="flex items-center gap-1 px-1.5 py-1 text-[11px] border border-slate-300 rounded hover:bg-slate-50">
            <Icon name="download" className="w-3 h-3" /> 엑셀 다운로드
          </button>
          <button onClick={() => { logChange(`9번 패키지`, `저장 (${monthLabel})`); alert('저장되었습니다!'); }}
            className="px-2.5 py-1 text-[11px] bg-blue-600 text-white rounded hover:bg-blue-700 font-semibold">
            저장
          </button>
        </div>

        <MenuNoteBanner noteKey={`pkg_note|${hq}|${yearMonth}`} monthLabel={monthLabel} hq={hq} year={curYear} weeklyEntries={weeklyEntries} setWeeklyEntries={setWeeklyEntries} />

        {/* === KPI 카드 5개 (당월) === */}
        {(() => {
          const UNIT_PRICE_KPI = { AO: 431, AR: 567, BD: 650 };
          const kpiPrep = monthRows.reduce((s, r) => s + (r.preparedKits || 0), 0);
          const kpiGoal = monthRows.reduce((s, r) => s + (r.salesGoal || 0), 0);
          const kpiSold = monthRows.reduce((s, r) => s + (r.soldKits || 0), 0);
          // 매출(자동) = 각 행의 (시스템수량 × 판매단가 × 판매수량) 합계, 위안 단위
          const kpiRevYuan = monthRows.reduce((s, r) => {
            const sysQ = r.preparedKits || 0;
            const up = r.salesGoal && r.salesGoal > 0 ? r.salesGoal : (UNIT_PRICE_KPI[r.salesSystem] || 0);
            const soldQ = r.soldKits || 0;
            return s + (sysQ * up * soldQ);
          }, 0);
          const kpiRev = +(kpiRevYuan / 1000).toFixed(1); // K RMB로 변환
          return (
            <div className="grid grid-cols-5 gap-3">
              <div className="bg-white border border-slate-200 rounded-md p-3">
                <div className="text-xs text-slate-500 mb-1">{monthLabel} 시스템수량</div>
                <div className="flex items-baseline gap-1">
                  <span className="text-xl font-bold text-slate-900">{formatNumber(kpiPrep)}</span>
                  <span className="text-xs text-slate-500">개</span>
                </div>
              </div>
              <div className="bg-white border border-slate-200 rounded-md p-3">
                <div className="text-xs text-slate-500 mb-1">{monthLabel} 판매목표</div>
                <div className="flex items-baseline gap-1">
                  <span className="text-xl font-bold text-slate-900">{formatNumber(kpiGoal)}</span>
                  <span className="text-xs text-slate-500">개</span>
                </div>
              </div>
              <div className="bg-white border border-slate-200 rounded-md p-3">
                <div className="text-xs text-slate-500 mb-1">{monthLabel} 판매수량</div>
                <div className="flex items-baseline gap-1">
                  <span className="text-xl font-bold text-slate-900">{formatNumber(kpiSold)}</span>
                  <span className="text-xs text-slate-500">개</span>
                </div>
                <div className="text-[10px] text-slate-500 mt-1">목표 {formatNumber(kpiGoal)}개 · 합계 100%</div>
              </div>
              <div className="bg-white border border-slate-200 rounded-md p-3">
                <div className="text-xs text-slate-500 mb-1">{monthLabel} 매출</div>
                <div className="flex items-baseline gap-1">
                  <span className="text-xl font-bold text-slate-900">{formatNumber(kpiRev)}</span>
                  <span className="text-xs text-slate-500">K RMB</span>
                </div>
              </div>
              <div className="bg-white border border-slate-200 rounded-md p-3">
                <div className="text-xs text-slate-500 mb-1">{monthLabel} 등록 건수</div>
                <div className="flex items-baseline gap-1">
                  <span className="text-xl font-bold text-slate-900">{monthRows.length}</span>
                  <span className="text-xs text-slate-500">건</span>
                </div>
              </div>
            </div>
          );
        })()}

        {/* === 표 === */}
        <div className="bg-white border border-slate-200 rounded-md p-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-base font-bold text-slate-900">패키지 판매 상세 ({monthLabel})</h3>
            <button onClick={addNewRow}
              className="flex items-center gap-1 px-2 py-1.5 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">
              <Icon name="plus" className="w-3.5 h-3.5" /> 행 추가
            </button>
          </div>

          <div className="border border-slate-300 rounded overflow-x-auto">
            <table className="w-full text-sm" data-table-id="package_sales" style={{ minWidth: isAgg ? "1040px" : undefined, tableLayout: 'fixed' }}>
              <thead>
                <tr className="bg-slate-100 border-b border-slate-300">
                  {isAgg && <th onClick={() => handleSort('_hq')} className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[90px] cursor-pointer hover:bg-slate-200 select-none bg-amber-50"><span className="inline-flex items-center gap-1">본부 <span className="text-[10px] text-slate-400">{sortIcon('_hq')}</span></span></th>}
                  <th onClick={() => handleSort('region')} className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[90px] cursor-pointer hover:bg-slate-200 select-none">
                    <span className="inline-flex items-center gap-1">지역 <span className="text-[10px] text-slate-400">{sortIcon('region')}</span></span>
                  </th>
                  <th onClick={() => handleSort('eventMonth')} className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[70px] cursor-pointer hover:bg-slate-200 select-none">
                    <span className="inline-flex items-center gap-1">행사월 <span className="text-[10px] text-slate-400">{sortIcon('eventMonth')}</span></span>
                  </th>
                  <th onClick={() => handleSort('dealerName')} className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[128px] cursor-pointer hover:bg-slate-200 select-none">
                    <span className="inline-flex items-center gap-1">대리상명 <span className="text-[10px] text-slate-400">{sortIcon('dealerName')}</span></span>
                  </th>
                  <th onClick={() => handleSort('eventName')} className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[120px] cursor-pointer hover:bg-slate-200 select-none">
                    <span className="inline-flex items-center gap-1">행사명칭 <span className="text-[10px] text-slate-400">{sortIcon('eventName')}</span></span>
                  </th>
                  <th onClick={() => handleSort('salesSystem')} className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[86px] cursor-pointer hover:bg-slate-200 select-none"><span className="inline-flex items-center gap-1">판매시스템<br/>(구분) <span className="text-[10px] text-slate-400">{sortIcon('salesSystem')}</span></span></th>
                  <th className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[72px]">시스템수량</th>
                  <th className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[76px]">판매단가<br/><span className="text-xs font-normal text-slate-500">(위안)</span></th>
                  <th className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[72px]">판매수량</th>
                  <th className="px-2 py-2 border-r border-slate-300 font-semibold text-slate-700 w-[92px]">판매매출<br/><span className="text-xs font-normal text-slate-500">(위안, 자동)</span></th>
                  <th className="px-2 py-2 font-semibold text-slate-700 w-[80px]">판매비중<br/><span className="text-xs font-normal text-slate-500">(전체 대비)</span></th>
                </tr>
              </thead>
              <tbody>
                {monthRows.length === 0 ? (
                  <tr><td colSpan={isAgg ? 11 : 10} className="px-2 py-12 text-center text-slate-400">{monthLabel}에 등록된 패키지 판매 데이터가 없습니다. [행 추가] 버튼을 클릭하세요.</td></tr>
                ) : (() => {
                  // ===== 전체 판매매출 합계 미리 계산 (판매비중용) =====
                  const UNIT_PRICE = { AO: 431, AR: 567, BD: 650 };
                  const totalRevenue = monthRows.reduce((sum, r) => {
                    const sysQty = r.preparedKits || 0;
                    const price = r.salesGoal && r.salesGoal > 0 ? r.salesGoal : (UNIT_PRICE[r.salesSystem] || 0);
                    const soldQ = r.soldKits || 0;
                    return sum + (sysQty * price * soldQ);
                  }, 0);
                  const revOf = (r) => {
                    const up = r.salesGoal && r.salesGoal > 0 ? r.salesGoal : (UNIT_PRICE[r.salesSystem] || 0);
                    return (r.preparedKits || 0) * up * (r.soldKits || 0);
                  };
                  const _rows = isAgg ? sortByCorpHQ(monthRows) : monthRows;
                  return _rows.map((row, ri, arr) => {
                  // 판매단가: 사용자가 입력했으면 그 값, 아니면 시스템 기본값
                  const unitPrice = row.salesGoal && row.salesGoal > 0 ? row.salesGoal : (UNIT_PRICE[row.salesSystem] || 0);
                  // 판매매출 = 시스템수량 × 판매단가 × 판매수량 (자동 계산)
                  const preparedQty = row.preparedKits || 0;
                  const soldQty = row.soldKits || 0;
                  const autoRevenue = preparedQty * unitPrice * soldQty;
                  // 판매비중 = 이 행 판매매출 ÷ 전체 판매매출 × 100
                  const salesShare = totalRevenue > 0 ? +(autoRevenue / totalRevenue * 100).toFixed(1) : 0;
                  // 법인 소계 (중국법인 전체일 때)
                  const corpEnd = isAgg && (ri === arr.length - 1 || arr[ri + 1]._corp !== row._corp);
                  const corpRows = isAgg ? arr.filter(x => x._corp === row._corp) : [];
                  const cPrepared = corpRows.reduce((s, x) => s + (x.preparedKits || 0), 0);
                  const cSold = corpRows.reduce((s, x) => s + (x.soldKits || 0), 0);
                  const cRev = corpRows.reduce((s, x) => s + revOf(x), 0);
                  const cShare = totalRevenue > 0 ? +(cRev / totalRevenue * 100).toFixed(1) : 0;
                  // 판매시스템 변경 시 → 판매단가도 시스템 기본값으로 자동 설정
                  const onChangeSystem = (newSystem) => {
                    updateRowField(row.id, 'salesSystem', newSystem);
                    // 시스템 변경 시 판매단가도 자동 업데이트
                    setTimeout(() => updateRowField(row.id, 'salesGoal', UNIT_PRICE[newSystem] || 0), 0);
                  };
                  return (
                    <React.Fragment key={(row._hq||"")+"_"+row.id}>
                    <tr className="border-b border-slate-200 hover:bg-slate-50 group">
                      {isAgg && (
                        <td className="px-2 py-1 border-r border-slate-300 text-center bg-amber-50/40">
                          <select value={row._hq} onChange={(e) => moveRowToHQ(row.id, e.target.value)}
                            className="px-1 py-0.5 text-xs border-0 bg-transparent outline-none cursor-pointer hover:bg-amber-100 rounded w-full text-center font-semibold">
                            {REAL_HQS.map(h => <option key={h} value={h}>{h}</option>)}
                          </select>
                        </td>
                      )}
                      {/* 지역 (드롭다운) */}
                      <td className="px-2 py-1 border-r border-slate-300 text-center">
                        <select value={row.region || (REGIONS[row._hq || hq] || ['지역'])[0]}
                          onChange={(e) => updateRowField(row.id, 'region', e.target.value)}
                          className="px-1 py-0.5 text-sm border-0 bg-transparent outline-none cursor-pointer hover:bg-blue-50 rounded w-full text-center font-semibold">
                          {(REGIONS[row._hq || hq] || []).map(r => <option key={r} value={r}>{r}</option>)}
                        </select>
                      </td>
                      {/* 행사월 */}
                      <td className="px-2 py-1 border-r border-slate-300 text-center">
                        <EditableCell value={row.eventMonth || ''} align="center" onSave={(v) => updateRowField(row.id, 'eventMonth', v)} />
                      </td>
                      {/* 대리상명 */}
                      <td className="px-2 py-1 border-r border-slate-300">
                        <EditableCell value={row.dealerName || ''} onSave={(v) => updateRowField(row.id, 'dealerName', v)} />
                      </td>
                      {/* 행사명칭 */}
                      <td className="px-2 py-1 border-r border-slate-300">
                        <EditableCell value={row.eventName || ''} onSave={(v) => updateRowField(row.id, 'eventName', v)} />
                      </td>
                      {/* 판매시스템 (드롭다운: AR/AO/BD) - 변경 시 판매단가 자동 적용 */}
                      <td className="px-2 py-1 border-r border-slate-300 text-center">
                        <select value={row.salesSystem || 'AR'}
                          onChange={(e) => onChangeSystem(e.target.value)}
                          className="px-1 py-0.5 text-sm border-0 bg-transparent outline-none cursor-pointer hover:bg-blue-50 rounded w-full text-center font-semibold">
                          <option value="AR">AR</option>
                          <option value="AO">AO</option>
                          <option value="BD">BD</option>
                        </select>
                      </td>
                      {/* 시스템수량 */}
                      <td className="px-2 py-1 border-r border-slate-300 text-right">
                        <EditableCell value={row.preparedKits || 0} type="number" align="right" onSave={(v) => updateRowField(row.id, 'preparedKits', v)} />
                      </td>
                      {/* 판매단가 (위안) - 수동 수정 가능, 비워두면 시스템 기본값 사용 */}
                      <td className="px-2 py-1 border-r border-slate-300 text-right">
                        <EditableCell value={unitPrice} type="number" align="right" onSave={(v) => updateRowField(row.id, 'salesGoal', parseFloat(v) || 0)} />
                      </td>
                      {/* 판매수량 */}
                      <td className="px-2 py-1 border-r border-slate-300 text-right">
                        <EditableCell value={row.soldKits || 0} type="number" align="right" onSave={(v) => updateRowField(row.id, 'soldKits', v)} />
                      </td>
                      {/* 판매매출 (자동 계산: 판매수량 × 판매단가) */}
                      <td className="px-2 py-2 border-r border-slate-300 text-right font-semibold bg-slate-50" title="시스템수량 × 판매단가 × 판매수량 (자동 계산)">
                        {formatNumber(autoRevenue)}
                      </td>
                      {/* 판매비중 (전체 대비, 자동 계산) + 호버 시 삭제 버튼 */}
                      <td className={`px-2 py-2 text-right font-semibold relative bg-blue-50/30 ${salesShare >= 30 ? 'text-emerald-600' : salesShare >= 15 ? 'text-blue-600' : salesShare >= 5 ? 'text-amber-600' : 'text-rose-600'}`} title="이 행 판매매출 ÷ 전체 판매매출 × 100">
                        {salesShare}%
                        <button onClick={() => deleteRow(row.id)}
                          className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-rose-400 hover:text-rose-600 transition"
                          title="행 삭제">
                          <Icon name="x" className="w-3.5 h-3.5" />
                        </button>
                      </td>
                    </tr>
                    {corpEnd && (
                      <tr className="bg-indigo-50 font-semibold border-b-2 border-indigo-200 text-indigo-900">
                        <td colSpan={6} className="px-2 py-1.5 border-r border-indigo-200 text-right text-xs">↳ {row._corp} 소계</td>
                        <td className="px-2 py-1.5 border-r border-indigo-200 text-right">{formatNumber(cPrepared)}</td>
                        <td className="px-2 py-1.5 border-r border-indigo-200"></td>
                        <td className="px-2 py-1.5 border-r border-indigo-200 text-right">{formatNumber(cSold)}</td>
                        <td className="px-2 py-1.5 border-r border-indigo-200 text-right">{formatNumber(cRev)}</td>
                        <td className="px-2 py-1.5 text-right">{cShare}%</td>
                      </tr>
                    )}
                    </React.Fragment>
                  );
                });
                })()}

                {/* 합계 행 */}
                {monthRows.length > 0 && (() => {
                  const UNIT_PRICE = { AO: 431, AR: 567, BD: 650 };
                  const sumSold = monthRows.reduce((s, r) => s + (r.soldKits || 0), 0);
                  const sumPrep = monthRows.reduce((s, r) => s + (r.preparedKits || 0), 0);
                  // 판매매출 합계 = 각 행별로 (시스템수량 × 판매단가 × 판매수량) 계산해서 합산
                  const sumRev = monthRows.reduce((s, r) => {
                    const sysQ = r.preparedKits || 0;
                    const up = r.salesGoal && r.salesGoal > 0 ? r.salesGoal : (UNIT_PRICE[r.salesSystem] || 0);
                    const soldQ = r.soldKits || 0;
                    return s + (sysQ * up * soldQ);
                  }, 0);
                  return (
                    <tr className="bg-slate-100 font-bold border-t-2 border-slate-400">
                      <td colSpan={isAgg ? 6 : 5} className="px-2 py-2 border-r border-slate-300 text-center">{monthLabel} 합계</td>
                      <td className="px-2 py-2 border-r border-slate-300 text-right">{formatNumber(sumPrep)}</td>
                      <td className="px-2 py-2 border-r border-slate-300 text-right text-slate-400">-</td>
                      <td className="px-2 py-2 border-r border-slate-300 text-right">{formatNumber(sumSold)}</td>
                      <td className="px-2 py-2 border-r border-slate-300 text-right bg-blue-50/30">{formatNumber(sumRev)}</td>
                      <td className="px-2 py-2 text-right bg-blue-100 text-emerald-700">100%</td>
                    </tr>
                  );
                })()}
              </tbody>
            </table>
          </div>

          <div className="mt-2 text-[11px] text-slate-500">
            * {monthLabel} 데이터만 표시됩니다. 월을 변경하면 해당 월의 데이터가 별도로 표시됩니다 (월별 분리 저장).
          </div>

          {/* === PKG 판매정책 안내 박스 === */}
          <div className="mt-4 bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-md p-4">
            <div className="flex items-center gap-2 mb-3">
              <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-blue-600 text-white text-xs font-bold">PKG</span>
              <h4 className="text-base font-bold text-slate-900">패키지 판매정책 안내</h4>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
              {/* AO */}
              <div className="bg-white border border-blue-200 rounded-md p-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-xs font-bold rounded">AO</span>
                  <span className="text-lg font-bold text-slate-900">431 <span className="text-xs font-normal text-slate-500">위안</span></span>
                </div>
                <div className="text-slate-700">
                  <div className="font-semibold mb-1">구성: 10 + 3</div>
                  <div className="text-xs text-slate-600">대리상 공급가격 <strong className="text-emerald-700">431위안</strong></div>
                </div>
              </div>
              {/* AR */}

  /* ===== 메뉴: 세미나 계획·실행 (계획 vs 실행 + 연간전체 + CAC/LTV) ===== */
  const SP_MPTAB = { edudetail: 'edu', educal: 'calEdu', compare: 'cmp', revenue: 'srev' };
  const renderSeminarPlanMP = () => mpView(SP_MPTAB[spTab]);
  const renderSeminarPlan = (hq) => {
    if (SP_MPTAB[spTab]) return renderSeminarPlanMP();
    const { year: curYear } = parseWeekValue(filterWeek);
    const isYear = (filterMonth === 0 || filterMonth === 'all' || filterMonth === '전체');
    const displayMonth = isYear ? 0 : (filterMonth || 5);
    const monthLabel = isYear ? '연간(전체)' : `${displayMonth}월`;
    const yearMonth = `${curYear}-${displayMonth}`;
    const inYM = (r) => isYear ? String(r.yearMonth || '').indexOf(`${curYear}-`) === 0 : (r.yearMonth || '') === yearMonth;

    const scope =
      hq === AGG_HQ ? 'all' :
      (CORP_LIST.indexOf(hq) >= 0 ? 'corp' : 'hq');

    const inScope = (row) => {
      const isCommon = (row.corp === '닝보·북경' || row.hq === '닝보·북경');
      if (hq === '닝보·북경') return isCommon;
      if (scope === 'all') return true;
      if (isCommon) return scope === 'corp';
      if (scope === 'corp') return row.corp === hq;
      return row.hq === hq;
    };

    const planAll = seminarPlan.filter(r => inYM(r) && inScope(r));
    const actualRaw = seminarActual.filter(r => inYM(r) && inScope(r));

    // === 매출이력(발주 누적) 헬퍼 ===
    // 각 실행 세미나(id)의 누적매출 = seminarRevenue 중 semId 일치 항목의 amount 합
    const revenueForSem = (semId) => (seminarRevenue || []).filter(v => v.semId === semId).reduce((s, v) => s + (v.amount || 0), 0);
    // 실행 행에 파생 매출(revenue) 부여 — 표/합계/CAC·LTV 계산에 사용
    const actualAll = actualRaw.map(r => ({ ...r, revenue: revenueForSem(r.id) }));

    // === 계획↔실행 자동 매칭 (일자 + 지역(도시)) + 수동보정(seminarMatch) ===
    const matchKey = (r) => `${String(r.date || '').trim()}|${String(r.cityKr || r.city || '').trim()}`;
    // 실행 세미나 id → 연결된 계획 id (수동 우선, 없으면 자동)
    const planByKey = {};
    seminarPlan.forEach(p => { const k = matchKey(p); if (!planByKey[k]) planByKey[k] = p.id; });
    const linkedPlanId = (actRow) => {
      if (seminarMatch && seminarMatch[actRow.id]) return seminarMatch[actRow.id]; // 수동 지정
      return planByKey[matchKey(actRow)] || null; // 자동
    };

    const HQORD = ['화남본부','화서본부','화동본부','절강본부','화중본부','북경법인','닝보·북경','미배정'];
    const sortRows = (arr) => {
      if (!spSortKey) return [...arr].sort((a,b) => {
        const ai = HQORD.indexOf(a.hq || '미배정'), bi = HQORD.indexOf(b.hq || '미배정');
        if (ai !== bi) return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
        return String(a.yearMonth||'').localeCompare(String(b.yearMonth||''), 'ko', {numeric:true})
            || String(a.date||'').localeCompare(String(b.date||''), 'ko', {numeric:true});
      });
      return [...arr].sort((a, b) => {
        const av = (a[spSortKey] ?? '').toString();
        const bv = (b[spSortKey] ?? '').toString();
        const cmp = av.localeCompare(bv, 'ko', { numeric: true });
        return spSortOrder === 'asc' ? cmp : -cmp;
      });
    };
    const handleSort = (key) => {
      if (spSortKey !== key) { setSpSortKey(key); setSpSortOrder('asc'); }
      else if (spSortOrder === 'asc') setSpSortOrder('desc');
      else { setSpSortKey(null); setSpSortOrder('asc'); }
    };
    const sortMark = (key) => spSortKey !== key ? '↕' : (spSortOrder === 'asc' ? '▲' : '▼');

    const sumOf = (arr) => arr.reduce((a, r) => ({
      cost: a.cost + (r.cost || 0),
      clinics: a.clinics + (r.clinics || 0),
      newCust: a.newCust + (r.newCust || 0),
      newDev: a.newDev + (r.newDev || 0),
      people: a.people + (r.people || 0),
      revenue: a.revenue + (r.revenue || 0),
    }), { cost: 0, clinics: 0, newCust: 0, newDev: 0, people: 0, revenue: 0 });
    const planSum = sumOf(planAll);
    const actualSum = sumOf(actualAll);
    const pct = (act, plan) => plan > 0 ? Math.round(act / plan * 100) : null;
    const cacOf = (s) => s.newCust > 0 ? +(s.cost / s.newCust).toFixed(2) : null;
    const rpcOf = (s) => s.newCust > 0 ? +(s.revenue / s.newCust).toFixed(2) : null;
    const roiOf = (s) => s.cost > 0 ? +(s.revenue / s.cost).toFixed(2) : null;

    const rateColor = (v) => v === null ? 'text-slate-400' : v >= 90 ? 'text-emerald-600' : v >= 60 ? 'text-blue-600' : v >= 30 ? 'text-amber-600' : 'text-rose-600';
    const barColor = (v) => v === null ? 'bg-slate-300' : v >= 90 ? 'bg-emerald-500' : v >= 60 ? 'bg-blue-500' : v >= 30 ? 'bg-amber-500' : 'bg-rose-400';
    const roiColor = (v) => v === null ? 'text-slate-400' : v >= 4 ? 'text-emerald-600' : v >= 2 ? 'text-blue-600' : v >= 1 ? 'text-amber-600' : 'text-rose-600';
    const fmt = (v) => (v === null || v === undefined) ? '-' : formatNumber(v);

    const tab = spTab;
    const activeRows = sortRows(tab === 'actual' ? actualAll : planAll);
    const activeSum = tab === 'actual' ? actualSum : planSum;
    const setDataset = tab === 'actual' ? setSeminarActual : setSeminarPlan;

    // === 중국법인 월별 추이 (그래프용) ===
    const showCharts = scope === 'all';
    const monthlySeries = showCharts ? (() => {
      const arr = [];
      for (let mo = 1; mo <= 12; mo++) {
        const ym = `${curYear}-${mo}`;
        const p = sumOf(seminarPlan.filter(r => (r.yearMonth || '') === ym));
        const a = sumOf(seminarActual.filter(r => (r.yearMonth || '') === ym).map(r => ({ ...r, revenue: revenueForSem(r.id) })));
        arr.push({
          month: `${mo}월`,
          비용계획: +p.cost.toFixed(1), 비용실행: +a.cost.toFixed(1),
          신규고객계획: p.newCust, 신규고객실행: a.newCust,
          'LTV/CAC계획': roiOf(p) || 0, 'LTV/CAC실행': roiOf(a) || 0,
        });
      }
      return arr;
    })() : [];

    const NUMERIC = ['cost', 'clinics', 'newCust', 'newDev', 'people', 'revenue'];
    const updateRow = (id, field, value) => {
      const fv = NUMERIC.indexOf(field) >= 0 ? (parseFloat(value) || 0) : value;
      setDataset(prev => prev.map(r => r.id === id ? { ...r, [field]: fv } : r));
    };
    const deleteRow = (id) => {
      if (!confirm('이 행을 삭제하시겠습니까?')) return;
      setDataset(prev => prev.filter(r => r.id !== id));
      logChange('세미나 계획·실행 - 삭제', `${tab} / ${id}`);
    };
    const addRow = () => {
      const mm = isYear ? 5 : displayMonth;
      const destCorp = scope === 'corp' ? hq : (scope === 'hq' ? HQ_CORP[hq] : '닝보법인');
      const destHQ = scope === 'hq' ? hq : (destCorp === '북경법인' ? '북경법인' : '미배정');
      const nr = {
        id: (tab === 'actual' ? 'act_' : 'plan_') + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        corp: destCorp, hq: destHQ, yearMonth: `${curYear}-${mm}`,
        date: '', bigRegion: '', city: '', cityKr: '',
        item: '', nature: '', topic: '', eduContent: '', lecturer: '',
        cost: 0, people: 0, revenue: 0, clinics: 0, newCust: 0, newDev: 0,
      };
      setDataset(prev => [...prev, nr]);
      logChange('세미나 계획·실행 - 신규', `${tab} / ${monthLabel} / ${destHQ}`);
    };
    const moveHQ = (id, newHQ) => {
      setDataset(prev => prev.map(r => r.id === id ? { ...r, hq: newHQ, corp: (newHQ === '닝보·북경' ? '닝보·북경' : (HQ_CORP[newHQ] || r.corp)) } : r));
      logChange('세미나 계획·실행 - 본부지정', `${id} → ${newHQ}`);
    };
    const toggleExpand = (id) => setSpExpanded(prev => ({ ...prev, [id]: !prev[id] }));

    // === 발주(매출이력) 추가/삭제 ===
    const addRevenue = (sem) => {
      const amtStr = prompt(`[${sem.cityKr || sem.city || '세미나'} / ${sem.date}] 추가 발주 금액 (만위안):`, '');
      if (amtStr === null) return;
      const amount = parseFloat(String(amtStr).replace(/,/g, ''));
      if (isNaN(amount) || amount === 0) { alert('숫자 금액을 입력해 주세요.'); return; }
      const moStr = prompt('발주 월 (숫자만, 예: 5):', String(displayMonth || 5));
      if (moStr === null) return;
      const mo = parseInt(moStr, 10) || (displayMonth || 5);
      const customer = prompt('고객/대리상 (선택):', '') || '';
      setSeminarRevenue(prev => [...prev, {
        id: 'rev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        semId: sem.id, yearMonth: `${curYear}-${mo}`, customer: customer, amount: amount, note: '',
      }]);
      logChange('세미나 매출이력 - 발주추가', `${sem.id} / ${mo}월 / ${amount}만`);
    };
    const deleteRevenue = (rid) => {
      if (!confirm('이 발주 이력을 삭제하시겠습니까?')) return;
      setSeminarRevenue(prev => prev.filter(v => v.id !== rid));
    };
    const updateRevenue = (rid, field, value) => {
      const fv = (field === 'amount') ? (parseFloat(value) || 0) : value;
      setSeminarRevenue(prev => prev.map(v => v.id === rid ? { ...v, [field]: fv } : v));
    };
    // 실행 세미나 id → 표시용 라벨
    const semLabel = (semId) => {
      const s = seminarActual.find(r => r.id === semId);
      return s ? `${s.date || ''} ${s.cityKr || s.city || ''} ${s.topic ? '· ' + s.topic.slice(0, 12) : ''}`.trim() : '(삭제된 세미나)';
    };

    const assignableHQs = scope === 'all'
      ? REAL_HQS
      : (scope === 'corp' ? (CORP_HQS[hq] || []) : (CORP_HQS[HQ_CORP[hq]] || []));

    const handleUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
          const norm = (s) => String(s).replace(/[\s\n\r()（）]/g, '');
          const pick = (row, cands) => {
            const keys = Object.keys(row);
            for (const c of cands) {
              const k = keys.find(k => norm(k).indexOf(norm(c)) === 0 || norm(c).indexOf(norm(k)) === 0);
              if (k !== undefined) return row[k];
            }
            return '';
          };
          const num = (v) => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
          const corpAlias = { '宁波':'닝보법인','北京':'북경법인','닝보':'닝보법인','북경':'북경법인' };
          const parsed = rows.map(r => {
            const topic = String(pick(r, ['主题','주제'])).trim();
            const dateV = String(pick(r, ['日期','일자'])).trim();
            if ((topic.indexOf('总计') >= 0) || (topic.indexOf('小计') >= 0)) return null;
            if (!dateV && !topic) return null;
            const rawCorp = String(pick(r, ['法人','법인','本部','본부'])).trim();
            const corp = corpAlias[rawCorp] || (rawCorp === '북경법인' ? '북경법인' : '닝보법인');
            const city = String(pick(r, ['城市','지역','도시'])).trim();
            const costRaw = num(pick(r, ['培训班确定费用','培训班预估费用','培训班费用','비용','세미나비용']));
            return {
              corp: corp,
              hq: corp === '북경법인' ? '북경법인' : '미배정',
              date: dateV,
              bigRegion: String(pick(r, ['大区','권역','대구'])).trim(),
              city: city,
              cityKr: (CITY_KR[city] || city),
              item: String(pick(r, ['类别','항목'])).trim(),
              nature: String(pick(r, ['性质','구분'])).trim(),
              topic: topic,
              eduContent: String(pick(r, ['教育内容','培训内容','교육내용','课程内容'])).trim(),
              lecturer: String(pick(r, ['讲师','강사'])).trim(),
              cost: costRaw > 1000 ? +(costRaw / 10000).toFixed(2) : costRaw,
              people: num(pick(r, ['总人数实际','总人数','총인원'])),
              revenue: num(pick(r, ['销售实际金额','新增销售额','销售额','매출'])),
              clinics: num(pick(r, ['门诊数','참석치과','치과수'])),
              newCust: num(pick(r, ['非用户数','신규고객'])),
              newDev: num(pick(r, ['新开发门诊数','新开发','신규개발'])),
            };
          }).filter(Boolean);
          if (parsed.length === 0) { alert('인식 가능한 행이 없습니다. 헤더를 확인해 주세요.'); return; }
          const monthGuess = (d) => { const m = String(d).match(/^(\d+)[.\-]/); return m ? +m[1] : (displayMonth || 5); };
          const target = tab === 'actual' ? '실행' : '계획';
          if (!confirm(`${target} 데이터로 ${parsed.length}건을 추가합니다.\n(월은 일자에서 자동 추정, 법인은 法人/本部 열 기준)\n\n계속하시겠습니까?`)) return;
          const newRows = parsed.map((p, i) => ({
            ...p,
            id: (tab === 'actual' ? 'act_' : 'plan_') + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 6),
            yearMonth: `${curYear}-${monthGuess(p.date)}`,
          }));
          if (tab === 'actual') {
            // 실행: 세미나 원장엔 매출칸 없음 → 각 세미나의 업로드 매출을 '그달 발주 1건'으로 매출이력에 자동 등록
            const revEntries = [];
            newRows.forEach(nr => {
              const amt = nr.revenue || 0;
              if (amt > 0) {
                revEntries.push({
                  id: 'rev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                  semId: nr.id, yearMonth: nr.yearMonth, customer: '(업로드)', amount: amt, note: '엑셀 업로드 자동등록',
                });
              }
              delete nr.revenue; // 원장엔 매출 저장 안 함(파생)
            });
            setSeminarActual(prev => [...prev, ...newRows]);
            if (revEntries.length) setSeminarRevenue(prev => [...prev, ...revEntries]);
            logChange('세미나 실행', `엑셀 업로드 ${newRows.length}건 (매출이력 ${revEntries.length}건 자동등록)`);
            alert(`✅ 실행 ${newRows.length}건 추가 완료!\n매출이력 ${revEntries.length}건 자동 등록됨`);
          } else {
            setDataset(prev => [...prev, ...newRows]);
            logChange('세미나 계획·실행', `엑셀 ${target} 업로드 ${newRows.length}건`);
            alert(`✅ ${target} ${newRows.length}건 추가 완료!`);
          }
        } catch (err) { alert('엑셀 읽기 실패: ' + err.message); }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    };

    const handleDownload = () => {
      if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리 로딩 실패'); return; }
      const wb = XLSX.utils.book_new();
      const src = tab === 'actual' ? actualAll : planAll;
      const data = (src.length ? src : [{}]).map(r => ({
        '법인': r.corp || '', '본부': r.hq || '', '일자': r.date || '',
        '권역': r.bigRegion || '', '지역': r.cityKr || r.city || '',
        '항목': itemKr(r.item) || '', '구분': natureKr(r.nature) || '', '주제': r.topic || '', '교육내용': r.eduContent || '', '강사': r.lecturer || '',
        '비용(만위안)': r.cost || 0, '총인원': r.people || 0, '매출(만위안)': r.revenue || 0,
        '참석치과': r.clinics || 0, '신규고객': r.newCust || 0, '신규개발': r.newDev || 0,
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), `${isYear ? '연간' : monthLabel}_${tab === 'actual' ? '실행' : '계획'}`);
      XLSX.writeFile(wb, `세미나_${tab === 'actual' ? '실행' : '계획'}_${hq}_${yearMonth}.xlsx`);
    };

    // === 이전월 복사 (현재 탭 기준) ===
    const handleCopyPrev = () => {
      if (tab !== 'plan' && tab !== 'actual') { alert('이전월 복사는 [계획] 또는 [실행] 탭에서 사용해 주세요.'); return; }
      if (isYear) { alert('연간(전체) 보기에서는 이전월 복사를 사용할 수 없습니다. 특정 월을 선택해 주세요.'); return; }
      const prevMonth = displayMonth - 1;
      if (prevMonth < 1) { alert('이전월이 없습니다 (1월에서는 사용 불가).'); return; }
      const dataset = tab === 'actual' ? seminarActual : seminarPlan;
      const prevRows = dataset.filter(r => (r.yearMonth || '') === `${curYear}-${prevMonth}` && inScope(r));
      if (prevRows.length === 0) { alert(`${prevMonth}월에 복사할 ${tab === 'actual' ? '실행' : '계획'} 데이터가 없습니다.`); return; }
      const curCount = dataset.filter(r => (r.yearMonth || '') === `${curYear}-${displayMonth}` && inScope(r)).length;
      let msg = `${prevMonth}월의 ${prevRows.length}건을 ${displayMonth}월로 복사하시겠습니까?`;
      if (curCount > 0) msg += `\n\n주의: ${displayMonth}월에 이미 ${curCount}건이 있습니다. 복사하면 기존에 추가됩니다.`;
      if (!confirm(msg)) return;

                      <td className="px-2 py-2 border-r border-slate-300 text-right bg-blue-50/40">{fmt(cacOf(activeSum))}</td>
                      <td className="px-2 py-2 border-r border-slate-300 text-right bg-blue-50/40">{fmt(rpcOf(activeSum))}</td>
                      <td className={`px-2 py-2 border-r border-slate-300 text-right bg-blue-100 ${roiColor(roiOf(activeSum))}`}>{roiOf(activeSum) === null ? '-' : roiOf(activeSum) + '배'}</td>
                      <td></td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
            <p className="mt-2 text-[11px] text-slate-500">
              * 기본 표에 CAC·LTV/CAC가 자동 계산됩니다(파란 칸, 수정 불가). 오른쪽 [더보기]에 법인·권역·구분·강사·지역·총인원·주제·교육내용·매출이 펼쳐집니다. 주제·교육내용은 길면 자동 줄바꿈됩니다.
              지역·항목·구분은 한국어로 표시되며, 비용·매출 단위는 만위안입니다. {isYear && '연간(전체)은 해당 연도 12개월 합산입니다.'}
            </p>

            <div className="mt-4 bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-md p-4">
              <div className="flex items-center gap-2 mb-3">
                <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-blue-600 text-white text-[10px] font-bold">ROI</span>
                <h4 className="text-base font-bold text-slate-900">세미나 투자효율 지표 산식</h4>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                <div className="bg-white border border-blue-200 rounded-md p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded">① CAC</span>
                    <span className="text-lg font-bold text-slate-900">{fmt(cacOf(activeSum))}</span>
                  </div>
                  <div className="font-semibold text-slate-900 mb-1">신규치과 획득비용</div>
                  <div className="text-xs text-slate-600">세미나 비용 ÷ 신규치과 수</div>
                  <div className="text-[11px] text-slate-500 mt-1">{formatNumber(+activeSum.cost.toFixed(2))}만 ÷ {formatNumber(activeSum.newCust)}개사</div>
                </div>
                <div className="bg-white border border-blue-200 rounded-md p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-xs font-bold rounded">② LTV</span>
                    <span className="text-lg font-bold text-slate-900">{fmt(rpcOf(activeSum))}</span>
                  </div>
                  <div className="font-semibold text-slate-900 mb-1">신규치과당 누적 구매액</div>
                  <div className="text-xs text-slate-600">신규치과 누적 구매액 ÷ 신규치과 수</div>
                  <div className="text-[11px] text-slate-500 mt-1">{formatNumber(+activeSum.revenue.toFixed(2))}만 ÷ {formatNumber(activeSum.newCust)}개사</div>
                </div>
                <div className="bg-white border border-blue-200 rounded-md p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="px-2 py-0.5 bg-purple-100 text-purple-700 text-xs font-bold rounded">③ LTV/CAC</span>
                    <span className={`text-lg font-bold ${roiColor(roiOf(activeSum))}`}>{roiOf(activeSum) === null ? '-' : roiOf(activeSum) + '배'}</span>
                  </div>
                  <div className="font-semibold text-slate-900 mb-1">세미나 투자효율지수</div>
                  <div className="text-xs text-slate-600">LTV ÷ CAC (= 신규 매출 ÷ 세미나 비용)</div>
                  <div className="text-[11px] text-slate-500 mt-1">1배 미만 손실 · 2~3배 양호 · 4배 이상 우수</div>
                </div>
              </div>
              <div className="mt-3 text-xs text-slate-600 bg-amber-50 border border-amber-200 rounded p-2">
                <strong>※ 금액 단위는 만위안(万元)</strong>입니다. CAC·LTV/CAC 2개 컬럼은 <strong>자동 계산</strong>되며 직접 수정할 수 없습니다.
                신규치과 수가 0이면 CAC는 <strong>-</strong>로, 비용이 0이면 LTV/CAC는 <strong>-</strong>로 표시됩니다.
              </div>
            </div>
          </div>
        )}
        <MenuNoteBanner noteKey={`sp_note|${hq}|${yearMonth}`} monthLabel={monthLabel} hq={hq} year={curYear} weeklyEntries={weeklyEntries} setWeeklyEntries={setWeeklyEntries} />
      </div>
    );
  };


  /* ===== 라우팅 ===== */
  const renderContent = () => {
    const hq = selectedHQ;
    let body;
    if (selectedMenu === 'kcx') return <div className="space-y-4">{mpView('kc')}</div>;
    if (selectedMenu === 'mk') return <div className="space-y-4">{renderMKCost()}</div>;
    if (selectedMenu === 'sc') body = renderSubCustomer(hq);
    else if (selectedMenu === 'sp') body = renderSeminarPlan(hq);
    else if (selectedMenu === 'mb') body = mpView('plan');

    else body = (mpTab === 'pkg') ? renderPackage(hq) : renderMarketingPlan();
    return <div className="space-y-4">{body}</div>;
  };

  return (
    <div className="flex h-screen bg-slate-100">
      {renderSidebar()}
      <div className="flex-1 flex flex-col min-w-0">
        <header className="h-14 bg-white border-b border-slate-200 flex items-center px-4 justify-between flex-shrink-0">
          <div className="flex items-baseline gap-2 min-w-0">
            <h1 className="text-lg font-bold text-slate-900 truncate">{selectedMenu === 'mk' ? '중국법인 MK비용' : (selectedMenu === 'kcx' ? '본사지원비용 (KIT Compensation)' : 'MGG 교육마케팅활동')}</h1>
            <span className="text-xs text-slate-400 truncate">{selectedMenu === 'mk' ? '닝보 · 북경' : (selectedMenu === 'kcx' ? '25년 · 26년 본사보고' : selectedHQ)}</span>
          </div>
          <span className="text-xs text-slate-400 hidden md:block">
            메가젠 중화영업본부 · {new Date().toLocaleDateString('ko-KR')} · v260807-0205
          </span>
        </header>
        {selectedMenu !== 'mk' && renderTopBar()}
        <main className="flex-1 overflow-y-auto p-4">
          {renderContent()}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
